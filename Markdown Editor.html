    function cycleEquationNumberingMode() {
      const current = getEquationNumberingMode();
      const next = {
        chapter: "sequence",
        sequence: "none",
        none: "chapter"
      }[current];

      setEquationNumberingMode(next);
    }

    function sanitizeCustomEquationLabel(value) {
      return String(value || "")
        .trim()
        .replace(/^\((.*)\)$/s, "$1")
        .replace(/\s+/g, " ")
        .replace(/[^\p{L}\p{N}\s.\-–—/（）()：:]/gu, "")
        .slice(0, 48)
        .trim();
    }

    function parseEquationNumberingMarker(text) {
      const originalText = String(text || "");
      const customMatch = originalText.match(
        /<!--\s*(?:(?:eq|equation)\s*:\s*)?(?:label|custom|number)\s*=\s*([^<>]*?)\s*-->/i
      );
      if (customMatch) {
        return {
          mode: "custom",
          customLabel: sanitizeCustomEquationLabel(customMatch[1]),
          cleanedText: originalText.replace(customMatch[0], "")
        };
      }

      const markerPattern =
        /<!--\s*(?:(?:eq|equation)\s*:\s*)?(number|no-number|numbered|unnumbered|编号|不编号)\s*-->/i;
      const match = originalText.match(markerPattern);
      if (!match) {
        return { mode: null, customLabel: "", cleanedText: originalText };
      }
      const value = match[1].toLowerCase();
      const forceNumber = value === "number" || value === "numbered" || value === "编号";
      return {
        mode: forceNumber ? "number" : "no-number",
        customLabel: "",
        cleanedText: originalText.replace(markerPattern, "")
      };
    }

    function shouldNumberEquation(markerMode, settings) {
      if (markerMode === "custom") return true;
      if (markerMode === "no-number") return false;
      if (!settings.enabled) return false;
      return true;
    }

    function buildCustomEquationTag(label) {
      const normalized = sanitizeCustomEquationLabel(label);

      if (!normalized) return "";

      /*
       * \tag{3.5} 会由 MathJax 自动显示为 (3.5)。
       * 不再套用 \text{...}，避免部分 MathJax 环境把
       * “\text”本身显示出来。
       */
      return normalized.replace(/\s+/g, "\\;");
    }

    function applyEquationNumbering(source, settings = getEquationNumberingSettings()) {
      const sourceText = String(source || "");
      const lines = sourceText.split("\n");
      const topLevelHeadingCount = marked.lexer(sourceText)
        .filter(token => token.type === "heading" && token.depth === 1).length;
      const chapterHeadingLevel = topLevelHeadingCount >= 2 ? 1 : 2;

      let inFence = false;
      let fenceCharacter = "";
      let fenceLength = 0;
      let inDisplayEquation = false;
      let displayStartLine = -1;
      let chapterNumber = 0;
      let equationNumber = 0;
      let globalEquationNumber = 0;
      let encounteredH1Count = 0;

      const isExactMarkerLine = line => {
        const parsed = parseEquationNumberingMarker(line);
        return parsed.mode !== null && parsed.cleanedText.trim() === "";
      };
      const readFollowingMarker = index => {
        if (index + 1 >= lines.length || !isExactMarkerLine(lines[index + 1])) return null;
        const parsed = parseEquationNumberingMarker(lines[index + 1]);
        lines[index + 1] = "";
        return parsed;
      };
      const containsManualTag = content => /\\tag\s*\{/.test(content);
      const containsNoNumberCommand = content => /\\(?:notag|nonumber)\b/.test(content);
      const canUseChapterNumber = () => settings.chapterStyle && chapterNumber > 0;
      const nextEquationLabel = () => {
        if (settings.chapterStyle) {
          equationNumber += 1;
          return `${chapterNumber}.${equationNumber}`;
        }
        globalEquationNumber += 1;
        return String(globalEquationNumber);
      };
      const resolveMarker = (trailing, following) => trailing.mode ? trailing : following;
      const resolveTag = marker => marker?.mode === "custom"
        ? buildCustomEquationTag(marker.customLabel)
        : nextEquationLabel();

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const trimmed = line.trim();
        if (!inDisplayEquation) {
          const fenceMatch = trimmed.match(/^(`{3,}|~{3,})/);
          if (fenceMatch) {
            const marker = fenceMatch[1];
            const character = marker[0];
            if (!inFence) {
              inFence = true; fenceCharacter = character; fenceLength = marker.length;
            } else if (character === fenceCharacter && marker.length >= fenceLength) {
              inFence = false; fenceCharacter = ""; fenceLength = 0;
            }
            continue;
          }
        }
        if (inFence) continue;

        if (!inDisplayEquation && /^#(?!#)\s+/.test(line)) {
          encounteredH1Count += 1;
          if (chapterHeadingLevel === 1 && encounteredH1Count >= 2) {
            chapterNumber += 1;
            if (settings.chapterStyle) equationNumber = 0;
          }
        } else if (!inDisplayEquation && chapterHeadingLevel === 2 && /^##(?!#)\s+/.test(line)) {
          chapterNumber += 1;
          if (settings.chapterStyle) equationNumber = 0;
        }

        if (!inDisplayEquation) {
          const single = line.match(/^(\s*)\$\$(?!\$)([\s\S]*?)\$\$(.*)$/);
          if (single) {
            const indent = single[1], body = single[2], trailing = single[3];
            const trailingMarker = parseEquationNumberingMarker(trailing);
            const followingMarker = trailingMarker.mode ? null : readFollowingMarker(index);
            const markerInfo = resolveMarker(trailingMarker, followingMarker);
            const mode = markerInfo?.mode || null;
            const should = shouldNumberEquation(mode, settings)
              && (mode === "custom" || !settings.chapterStyle || canUseChapterNumber())
              && !containsManualTag(body) && !containsNoNumberCommand(body);
            lines[index] = should
              ? `${indent}$$${body}\\tag{${resolveTag(markerInfo)}}$$${trailingMarker.cleanedText}`
              : `${indent}$$${body}$$${trailingMarker.cleanedText}`;
            continue;
          }
        }

        if (!inDisplayEquation && trimmed === "$$") {
          inDisplayEquation = true; displayStartLine = index; continue;
        }
        if (inDisplayEquation) {
          const closing = line.match(/^(\s*)\$\$(.*)$/);
          if (!closing) continue;
          const indent = closing[1], trailing = closing[2];
          const trailingMarker = parseEquationNumberingMarker(trailing);
          const followingMarker = trailingMarker.mode ? null : readFollowingMarker(index);
          const markerInfo = resolveMarker(trailingMarker, followingMarker);
          const mode = markerInfo?.mode || null;
          const body = lines.slice(displayStartLine + 1, index).join("\n");
          const should = shouldNumberEquation(mode, settings)
            && (mode === "custom" || !settings.chapterStyle || canUseChapterNumber())
            && !containsManualTag(body) && !containsNoNumberCommand(body);
          lines[index] = should
            ? `${indent}\\tag{${resolveTag(markerInfo)}}$$${trailingMarker.cleanedText}`
            : `${indent}$$${trailingMarker.cleanedText}`;
          inDisplayEquation = false; displayStartLine = -1;
        }
      }
      return lines.join("\n");
    }


    function getRenderableSourceBlocks(source) {
      const tokens = marked.lexer(String(source || ""));
      const lineStarts = getLineStarts(String(source || ""));
      const blocks = [];
      let cursor = 0;

      tokens.forEach(token => {
        const raw = token.raw || "";
        let start = raw
          ? String(source || "").indexOf(raw, cursor)
          : cursor;

        if (start < 0) start = cursor;

        const end = Math.min(
          String(source || "").length,
          start + raw.length
        );
        cursor = Math.max(cursor, end);

        if (
          token.type === "space" ||
          token.type === "def"
        ) {
          return;
        }

        const marker = parseEquationNumberingMarker(raw);
        if (
          marker.mode &&
          marker.cleanedText.trim() === ""
        ) {
          return;
        }

        const tokenList = [token];
        tokenList.links = tokens.links || {};
        const visibleHTML = marked.parser(tokenList)
          .replace(/<!--[\s\S]*?-->/g, "")
          .trim();

        if (!visibleHTML) return;

        blocks.push({
          id: `preview-block-${blocks.length + 1}`,
          start,
          end,
          raw,
          type: token.type || "paragraph",
          sourceLine: lineFromCharacterIndex(
            lineStarts,
            start
          ),
          kind: detectPreviewBlockKind(token, raw)
        });
      });

      return blocks;
    }

    function normalizePreviewTokenType(type) {
      const normalized = String(type || "");

      if (
        normalized === "paragraph" ||
        normalized === "text"
      ) {
        return "paragraph";
      }

      return normalized;
    }

    function isFormulaOnlySource(raw) {
      const text = String(raw || "").trim();

      return (
        /^\$\$[\s\S]*?\$\$(?:\s*<!--[\s\S]*?-->)?$/.test(text) ||
        /^\\\[[\s\S]*?\\\](?:\s*<!--[\s\S]*?-->)?$/.test(text)
      );
    }

    function isSingleImageSource(raw) {
      const text = String(raw || "").trim();
      const imageMatches = text.match(
        /!\[[^\]\n]*\](?:\([^\n)]*\)|\[[^\]\n]*\])(?:\s*\{[^{}\n]*\})?/g
      );

      if (!imageMatches || imageMatches.length !== 1) {
        return false;
      }

      const withoutImage = text
        .replace(imageMatches[0], "")
        .replace(/<!--[\s\S]*?-->/g, "")
        .trim();

      return !withoutImage;
    }

    function detectPreviewBlockKind(token, raw) {
      const source = String(raw || "");
      const type = normalizePreviewTokenType(
        token?.type || "paragraph"
      );

      if (isFormulaOnlySource(source)) return "formula";
      if (isSingleImageSource(source)) return "image";

      const hasMath =
        /(^|[^\\])\$(?!\$)[^$\n]+?\$/m.test(source) ||
        /\$\$|\\\[|\\\(/.test(source);
      const hasImage = /!\[[^\]]*\]/.test(source);

      if (hasMath || hasImage) return "source";
      if (type === "html") return "source";
      if (type === "hr") return "readonly";

      if (
        [
          "heading",
          "paragraph",
          "list",
          "blockquote",
          "table",
          "code"
        ].includes(type)
      ) {
        return type;
      }

      return "source";
    }

    function findMatchingSourceBlock(
      renderedToken,
      sourceBlocks,
      startIndex
    ) {
      const wantedType = normalizePreviewTokenType(
        renderedToken?.type
      );

      for (
        let offset = 0;
        offset < 5 &&
        startIndex + offset < sourceBlocks.length;
        offset += 1
      ) {
        const candidate = sourceBlocks[startIndex + offset];

        if (
          normalizePreviewTokenType(candidate.type) ===
          wantedType
        ) {
          return {
            block: candidate,
            nextIndex: startIndex + offset + 1
          };
        }
      }

      return {
        block: sourceBlocks[startIndex] || null,
        nextIndex: Math.min(
          sourceBlocks.length,
          startIndex + 1
        )
      };
    }

    function setPreviewBlockAttributes(
      element,
      block
    ) {
      if (!element || !block) return;

      element.classList.add("preview-source-block");
      element.dataset.blockId = block.id;
      element.dataset.sourceStart = String(block.start);
      element.dataset.sourceEnd = String(block.end);
      element.dataset.sourceLine = String(block.sourceLine);
      element.dataset.tokenType = block.type;
      element.dataset.blockKind = block.kind;
    }

    function getPreviewBlockRecord(blockOrId) {
      const id =
        typeof blockOrId === "string"
          ? blockOrId
          : blockOrId instanceof Element
            ? blockOrId.dataset?.blockId
            : blockOrId?.id ||
              blockOrId?.dataset?.blockId;

      if (!id) return null;

      return previewBlockMap.find(
        item => item.id === id
      ) || null;
    }

    function getPreviewBlockElement(node = null) {
      const target =
        node ||
        window.getSelection()?.anchorNode ||
        document.activeElement;

      if (!target) return null;

      const element =
        target.nodeType === Node.ELEMENT_NODE
          ? target
          : target.parentElement;

      return element?.closest?.(".preview-source-block") || null;
    }

    function getPrimaryPreviewBlockElement(blockId) {
      if (!blockId) return null;

      return preview.querySelector(
        `.preview-source-block[data-block-id="${CSS.escape(blockId)}"]`
      );
    }

    function updateMappedBlockPositions(
      changedRecord,
      nextRaw
    ) {
      const oldEnd = changedRecord.end;
      const delta = nextRaw.length - changedRecord.raw.length;

      changedRecord.raw = nextRaw;
      changedRecord.end =
        changedRecord.start + nextRaw.length;

      previewBlockMap.forEach(record => {
        if (
          record.id !== changedRecord.id &&
          record.start >= oldEnd
        ) {
          record.start += delta;
          record.end += delta;
        }

        preview
          .querySelectorAll(
            `.preview-source-block[data-block-id="${CSS.escape(record.id)}"]`
          )
          .forEach(element => {
            element.dataset.sourceStart =
              String(record.start);
            element.dataset.sourceEnd =
              String(record.end);
          });
      });
    }

    function replaceMappedPreviewBlockSource(
      blockOrId,
      nextRaw,
      options = {}
    ) {
      const record = getPreviewBlockRecord(blockOrId);

      if (!record) return false;

      const currentRaw = editor.value.slice(
        record.start,
        record.end
      );

      if (currentRaw !== record.raw) {
        alert(
          "左侧源码已经发生变化，为避免覆盖新内容，" +
          "本次右侧修改没有写入。\n" +
          "页面将重新渲染，请再试一次。"
        );
        renderNow();
        return false;
      }

      const normalizedRaw = String(nextRaw ?? "");
      const beforeSource = editor.value;

      editor.setRangeText(
        normalizedRaw,
        record.start,
        record.end,
        "preserve"
      );

      updateMappedBlockPositions(record, normalizedRaw);
      savedEditorSelection = {
        start: record.start,
        end: record.end
      };
      lastEditOrigin = "preview";
      scheduleDraftSave();

      if (options.recordHistory) {
        rightEditUndoStack.push({
          before: beforeSource,
          after: editor.value
        });
        rightEditUndoStack =
          rightEditUndoStack.slice(-80);
        rightEditRedoStack = [];
      }

      if (options.render) {
        renderNow();
      } else {
        setStatus("右侧修改已同步到左侧源码");
      }

      return true;
    }

    function preservePreviewBlockWhitespace(
      originalRaw,
      coreMarkdown
    ) {
      const source = String(originalRaw || "");
      const leading =
        source.match(/^\n+/)?.[0] || "";
      const trailing =
        source.match(/\n+$/)?.[0] || "\n\n";
      const core = String(coreMarkdown || "")
        .replace(/^\n+|\n+$/g, "");

      return leading + core + trailing;
    }

    function escapeMarkdownTableCell(value) {
      return String(value || "")
        .replace(/\r?\n/g, "<br>")
        .replace(/\|/g, "\\|")
        .trim();
    }

    function longestBacktickRun(value) {
      const runs = String(value || "").match(/`+/g) || [];
      return runs.reduce(
        (maximum, run) => Math.max(maximum, run.length),
        0
      );
    }

    function serializeInlineNode(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return node.nodeValue
          .replace(/\u00a0/g, " ");
      }

      if (node.nodeType !== Node.ELEMENT_NODE) {
        return "";
      }

      const tag = node.tagName.toLowerCase();

      if (
        tag === "span" &&
        node.hasAttribute("data-md-indent")
      ) {
        const level = Math.max(
          1,
          Math.min(
            12,
            Number.parseInt(
              node.getAttribute("data-md-indent"),
              10
            ) || 1
          )
        );
        const content = Array.from(node.childNodes)
          .map(serializeInlineNode)
          .join("");

        return buildMarkdownIndentContent(
          content,
          level
        );
      }
      const inner = Array.from(node.childNodes)
        .map(serializeInlineNode)
        .join("");

      if (tag === "br") return "  \n";
      if (tag === "strong" || tag === "b") {
        return `**${inner}**`;
      }
      if (tag === "em" || tag === "i") {
        return `*${inner}*`;
      }
      if (
        tag === "del" ||
        tag === "s" ||
        tag === "strike"
      ) {
        return `~~${inner}~~`;
      }
      if (tag === "u") return `<u>${inner}</u>`;
      if (tag === "mark") return `<mark>${inner}</mark>`;
      if (tag === "sub") return `<sub>${inner}</sub>`;
      if (tag === "sup") return `<sup>${inner}</sup>`;

      if (tag === "code" && node.parentElement?.tagName !== "PRE") {
        const text = node.textContent || "";
        const fence = "`".repeat(
          Math.max(1, longestBacktickRun(text) + 1)
        );
        return `${fence}${text}${fence}`;
      }

      if (tag === "a") {
        const href = node.getAttribute("href") || "";
        const title = node.getAttribute("title");
        const titlePart = title
          ? ` "${title.replace(/"/g, '\\"')}"`
          : "";

        return `[${inner || href}](${href}${titlePart})`;
      }

      if (tag === "span") {
        const allowed = [
          "font-size",
          "color",
          "background-color"
        ];
        const styles = allowed
          .map(property => {
            const value = node.style.getPropertyValue(property);
            return value ? `${property}: ${value};` : "";
          })
          .filter(Boolean)
          .join(" ");

        if (styles) {
          return `<span style="${styles}">${inner}</span>`;
        }
      }

      if (tag === "input" && node.type === "checkbox") {
        return "";
      }

      if (tag === "div" || tag === "p") {
        return inner + "\n";
      }

      return inner;
    }

    function serializeInlineChildren(element) {
      return Array.from(element.childNodes)
        .map(serializeInlineNode)
        .join("")
        .trim();
    }

    function serializeListElement(list, depth = 0) {
      const ordered =
        list.tagName.toLowerCase() === "ol";
      const items = Array.from(list.children)
        .filter(child => child.tagName?.toLowerCase() === "li");
      let number = Number.parseInt(
        list.getAttribute("start") || "1",
        10
      );

      return items.map(item => {
        const nestedLists = Array.from(item.children)
          .filter(child => {
            const tag = child.tagName?.toLowerCase();
            return tag === "ul" || tag === "ol";
          });

        const contentNodes = Array.from(item.childNodes)
          .filter(node => !nestedLists.includes(node));
        let content = contentNodes
          .map(serializeInlineNode)
          .join("")
          .trim();

        const checkbox = item.querySelector(
          ":scope > input[type='checkbox']"
        );

        if (checkbox) {
          content =
            `[${checkbox.checked ? "x" : " "}] ` +
            content;
        }

        const prefix = ordered
          ? `${number}. `
          : "- ";
        number += 1;

        const indent = "  ".repeat(depth);
        const nested = nestedLists
          .map(child => serializeListElement(child, depth + 1))
          .filter(Boolean)
          .join("\n");

        return (
          `${indent}${prefix}${content}` +
          (nested ? `\n${nested}` : "")
        );
      }).join("\n");
    }

    function serializeTableElement(table) {
      const rows = Array.from(
        table.querySelectorAll("tr")
      );

      if (!rows.length) return "";

      const rowValues = rows.map(row =>
        Array.from(row.children)
          .filter(cell => {
            const tag = cell.tagName.toLowerCase();
            return tag === "th" || tag === "td";
          })
          .map(cell =>
            escapeMarkdownTableCell(
              serializeInlineChildren(cell)
            )
          )
      );

      const columnCount = Math.max(
        1,
        ...rowValues.map(row => row.length)
      );
      const normalizedRows = rowValues.map(row => {
        const copy = row.slice();

        while (copy.length < columnCount) copy.push("");

        return copy;
      });
      const header = normalizedRows[0];
      const body = normalizedRows.slice(1);

      return [
        `| ${header.join(" | ")} |`,
        `| ${Array(columnCount).fill("---").join(" | ")} |`,
        ...body.map(row => `| ${row.join(" | ")} |`)
      ].join("\n");
    }

    function wrapSerializedAlignment(
      element,
      markdown
    ) {
      const alignment = element.style?.textAlign;

      if (
        !alignment ||
        alignment === "start" ||
        alignment === "left"
      ) {
        return markdown;
      }

      return (
        `<div style="text-align: ${alignment};">\n` +
        `${markdown}\n</div>`
      );
    }

    function serializePreviewBlock(block) {
      if (!block) return "";

      const tag = block.tagName.toLowerCase();
      let markdown = "";

      if (/^h[1-6]$/.test(tag)) {
        markdown =
          `${"#".repeat(Number(tag.slice(1)))} ` +
          serializeInlineChildren(block);
      } else if (tag === "p") {
        markdown = serializeInlineChildren(block);
      } else if (tag === "ul" || tag === "ol") {
        markdown = serializeListElement(block);
      } else if (tag === "blockquote") {
        const content = Array.from(block.children).length
          ? Array.from(block.children)
              .map(child => {
                const childTag =
                  child.tagName.toLowerCase();

                if (childTag === "p") {
                  return serializeInlineChildren(child);
                }
                if (
                  childTag === "ul" ||
                  childTag === "ol"
                ) {
                  return serializeListElement(child);
                }

                return child.textContent || "";
              })
              .join("\n")
          : serializeInlineChildren(block);

        markdown = content
          .split("\n")
          .map(line => `> ${line}`)
          .join("\n");
      } else if (tag === "pre") {
        const code =
          block.querySelector("code") || block;
        const languageClass = Array.from(
          code.classList || []
        ).find(value => value.startsWith("language-"));
        const language = languageClass
          ? languageClass.slice("language-".length)
          : "";
        const text = code.textContent || "";
        const fence = "`".repeat(
          Math.max(3, longestBacktickRun(text) + 1)
        );

        markdown =
          `${fence}${language}\n${text.replace(/\n$/, "")}\n${fence}`;
      } else if (tag === "table") {
        markdown = serializeTableElement(block);
      } else if (tag === "hr") {
        markdown = "---";
      } else {
        markdown = serializeInlineChildren(block);
      }

      return wrapSerializedAlignment(block, markdown);
    }

    function savePreviewSelection() {
      if (!rightEditingEnabled) return;

      const selection = window.getSelection();

      if (!selection || !selection.rangeCount) return;

      const block = getPreviewBlockElement(
        selection.anchorNode
      );

      if (
        !block ||
        block.dataset.rightEditable !== "true"
      ) {
        return;
      }

      savedPreviewRange =
        selection.getRangeAt(0).cloneRange();
      activePreviewBlockId =
        block.dataset.blockId || "";
      activeEditingSurface = "preview";
    }

    function restorePreviewSelection() {
      if (!savedPreviewRange) return null;

      const block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );

      if (!block?.isConnected) return null;

      try {
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(savedPreviewRange);
        return block;
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    function hasActivePreviewSelection() {
      if (
        !rightEditingEnabled ||
        activeEditingSurface !== "preview"
      ) {
        return false;
      }

      const block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );

      return Boolean(
        block &&
        block.dataset.rightEditable === "true" &&
        savedPreviewRange
      );
    }

    function beginPreviewEditingSession(block) {
      if (!block) return;

      if (
        previewEditingSession?.blockId ===
        block.dataset.blockId
      ) {
        return;
      }

      if (previewEditingSession) {
        const previousBlock =
          getPrimaryPreviewBlockElement(
            previewEditingSession.blockId
          );

        if (
          previousBlock?.dataset.rightEditable ===
          "true"
        ) {
          commitPreviewBlock(
            previousBlock,
            false
          );
        }

        finalizePreviewEditingSession(false);
      }

      previewEditingSession = {
        blockId: block.dataset.blockId,
        sourceBefore: editor.value
      };
    }

    function finalizePreviewEditingSession(renderAfter = true) {
      clearTimeout(previewCommitTimer);

      const session = previewEditingSession;

      if (!session) {
        if (renderAfter) renderNow();
        return;
      }

      if (session.sourceBefore !== editor.value) {
        rightEditUndoStack.push({
          before: session.sourceBefore,
          after: editor.value
        });
        rightEditUndoStack =
          rightEditUndoStack.slice(-80);
        rightEditRedoStack = [];
      }

      previewEditingSession = null;

      if (renderAfter) {
        renderNow();
      }
    }

    function commitPreviewBlock(
      block,
      renderAfter = false
    ) {
      if (
        !block ||
        block.dataset.rightEditable !== "true"
      ) {
        return false;
      }

      const record = getPreviewBlockRecord(block);
      if (!record) return false;

      const markdown = serializePreviewBlock(block);
      const nextRaw = preservePreviewBlockWhitespace(
        record.raw,
        markdown
      );

      return replaceMappedPreviewBlockSource(
        record,
        nextRaw,
        { render: renderAfter }
      );
    }

    function schedulePreviewBlockCommit(block) {
      if (!block) return;

      beginPreviewEditingSession(block);
      clearTimeout(previewCommitTimer);

      previewCommitTimer = setTimeout(() => {
        commitPreviewBlock(block, false);
      }, 320);
    }

    function selectPreviewElementContents(element) {
      const range = document.createRange();
      range.selectNodeContents(element);

      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      savedPreviewRange = range.cloneRange();

      const block =
        element.closest?.(".preview-source-block") ||
        (
          element.classList?.contains(
            "preview-source-block"
          )
            ? element
            : null
        );

      activePreviewBlockId =
        block?.dataset?.blockId || "";
      activeEditingSurface = "preview";
    }

    function replacePreviewBlockTag(block, tagName) {
      const replacement =
        document.createElement(tagName);

      Array.from(block.attributes).forEach(attribute => {
        replacement.setAttribute(
          attribute.name,
          attribute.value
        );
      });
      replacement.innerHTML = block.innerHTML;
      block.replaceWith(replacement);
      selectPreviewElementContents(replacement);
      schedulePreviewBlockCommit(replacement);

      return replacement;
    }

    function applyPreviewInlineCommand(
      command,
      value = null
    ) {
      const block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );

      if (!block || !savedPreviewRange) {
        return false;
      }

      block.focus({ preventScroll: true });

      if (!restorePreviewSelection()) {
        return false;
      }

      try {
        document.execCommand(
          command,
          false,
          value
        );
      } catch (error) {
        console.error(error);
        return false;
      }

      savePreviewSelection();
      schedulePreviewBlockCommit(
        getPreviewBlockElement() || block
      );
      return true;
    }

    function wrapPreviewSelection(
      tagName,
      styles = {},
      placeholder = "文字"
    ) {
      const block = restorePreviewSelection();

      if (!block || !savedPreviewRange) return false;

      const range = savedPreviewRange;
      const wrapper = document.createElement(tagName);

      Object.entries(styles).forEach(
        ([property, value]) => {
          wrapper.style.setProperty(property, value);
        }
      );

      if (range.collapsed) {
        wrapper.textContent = placeholder;
        range.insertNode(wrapper);
      } else {
        const contents = range.extractContents();
        wrapper.appendChild(contents);
        range.insertNode(wrapper);
      }

      const nextRange = document.createRange();
      nextRange.selectNodeContents(wrapper);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(nextRange);
      savedPreviewRange = nextRange.cloneRange();
      activePreviewBlockId =
        block.dataset.blockId || "";
      activeEditingSurface = "preview";
      schedulePreviewBlockCommit(block);

      return true;
    }

    function applyPreviewHeadingLevel(levelValue) {
      if (!hasActivePreviewSelection()) return false;

      const block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );
      if (!block) return false;

      const level = Number.parseInt(
        levelValue,
        10
      );
      const tagName =
        level >= 1 && level <= 6
          ? `h${level}`
          : "p";

      replacePreviewBlockTag(block, tagName);
      return true;
    }

    function applyPreviewListType(type) {
      if (!hasActivePreviewSelection()) return false;

      let block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );
      if (!block) return false;

      if (type === "quote") {
        if (
          block.tagName.toLowerCase() ===
          "blockquote"
        ) {
          const paragraph =
            document.createElement("p");
          paragraph.innerHTML =
            block.querySelector("p")?.innerHTML ||
            block.innerHTML;
          Array.from(block.attributes).forEach(attribute => {
            paragraph.setAttribute(
              attribute.name,
              attribute.value
            );
          });
          block.replaceWith(paragraph);
          block = paragraph;
        } else {
          const quote =
            document.createElement("blockquote");
          const paragraph =
            document.createElement("p");
          paragraph.innerHTML = block.innerHTML;
          quote.appendChild(paragraph);
          Array.from(block.attributes).forEach(attribute => {
            quote.setAttribute(
              attribute.name,
              attribute.value
            );
          });
          block.replaceWith(quote);
          block = quote;
        }

        selectPreviewElementContents(block);
        schedulePreviewBlockCommit(block);
        return true;
      }

      const wantedTag =
        type === "ordered" ? "ol" : "ul";
      const currentTag =
        block.tagName.toLowerCase();

      if (
        currentTag === "ul" ||
        currentTag === "ol"
      ) {
        if (currentTag === wantedTag) {
          const paragraph =
            document.createElement("p");
          paragraph.innerHTML = Array.from(
            block.querySelectorAll(":scope > li")
          )
            .map(item => {
              const clone = item.cloneNode(true);
              clone
                .querySelectorAll("ul, ol")
                .forEach(nested => nested.remove());
              return clone.innerHTML;
            })
            .join("<br>");
          Array.from(block.attributes).forEach(attribute => {
            paragraph.setAttribute(
              attribute.name,
              attribute.value
            );
          });
          block.replaceWith(paragraph);
          block = paragraph;
        } else {
          block = replacePreviewBlockTag(
            block,
            wantedTag
          );
        }
      } else {
        const list = document.createElement(wantedTag);
        const lines = (block.innerText || "")
          .split(/\n+/)
          .map(line => line.trim())
          .filter(Boolean);

        (lines.length ? lines : ["列表项目"])
          .forEach(line => {
            const item = document.createElement("li");

            if (type === "task") {
              const checkbox =
                document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.disabled = true;
              item.appendChild(checkbox);
              item.append(" ");
            }

            item.append(line);
            list.appendChild(item);
          });

        Array.from(block.attributes).forEach(attribute => {
          list.setAttribute(
            attribute.name,
            attribute.value
          );
        });
        block.replaceWith(list);
        block = list;
      }

      selectPreviewElementContents(block);
      schedulePreviewBlockCommit(block);
      return true;
    }

    function applyPreviewAlignment(alignment) {
      if (!hasActivePreviewSelection()) return false;

      const block = getPrimaryPreviewBlockElement(
        activePreviewBlockId
      );
      if (!block) return false;

      block.style.textAlign = alignment;
      schedulePreviewBlockCommit(block);
      return true;
    }

    function applyPreviewIndent(direction) {
      if (!hasActivePreviewSelection()) return false;

      const block = restorePreviewSelection();
      if (!block) return false;

      const record = getPreviewBlockRecord(block);
      if (!record) return false;

      const nextRaw = adjustMarkdownBlockIndent(
        record.raw,
        direction
      );

      if (nextRaw === record.raw) {
        return true;
      }

      const changed = replaceMappedPreviewBlockSource(
        record,
        nextRaw,
        {
          recordHistory: true,
          render: true
        }
      );

      if (changed) {
        setStatus(
          direction > 0
            ? "右侧内容已增加缩进"
            : "右侧内容已减少缩进"
        );
      }

      return changed;
    }

    function insertSourceAfterActivePreviewBlock(
      sourceText
    ) {
      const record = getPreviewBlockRecord(
        activePreviewBlockId
      );

      if (!record) return false;

      const insertion =
        String(sourceText || "").startsWith("\n")
          ? String(sourceText || "")
          : `\n${sourceText}`;

      editor.setRangeText(
        insertion,
        record.end,
        record.end,
        "end"
      );
      lastEditOrigin = "preview";
      scheduleDraftSave();
      renderNow();

      return true;
    }

    function prepareSourceInsertionFromPreview() {
      if (
        !rightEditingEnabled ||
        activeEditingSurface !== "preview"
      ) {
        return;
      }

      const record = getPreviewBlockRecord(
        activePreviewBlockId
      );

      if (!record) return;

      editor.setSelectionRange(
        record.end,
        record.end
      );
      savedEditorSelection = {
        start: record.end,
        end: record.end
      };
    }

    function setRightEditButtonState() {
      rightEditButton.textContent =
        "右侧编辑：" +
        (rightEditingEnabled ? "开" : "关");
      rightEditButton.setAttribute(
        "aria-pressed",
        String(rightEditingEnabled)
      );
      rightEditButton.classList.toggle(
        "is-active",
        rightEditingEnabled
      );
    }

    function applyRightEditingState() {
      preview.classList.toggle(
        "right-editing-enabled",
        rightEditingEnabled
      );

      preview
        .querySelectorAll(".preview-source-block")
        .forEach(block => {
          block.removeAttribute("contenteditable");
          block.removeAttribute("spellcheck");
          block.removeAttribute("data-right-editable");
          block.removeAttribute("data-right-special");
          block.removeAttribute("data-right-edit-hint");

          if (!rightEditingEnabled) return;

          const kind = block.dataset.blockKind;

          if (
            [
              "heading",
              "paragraph",
              "list",
              "blockquote",
              "table",
              "code"
            ].includes(kind)
          ) {
            block.contentEditable = "true";
            block.spellcheck = true;
            block.dataset.rightEditable = "true";
          } else if (
            ["formula", "image", "source"].includes(kind)
          ) {
            block.dataset.rightSpecial = "true";
            block.dataset.rightEditHint =
              kind === "formula"
                ? "双击编辑公式"
                : kind === "image"
                  ? "双击编辑图片"
                  : "双击编辑这一段源码";
          }
        });

      setRightEditButtonState();
    }

    async function toggleRightEditing() {
      if (rightEditingEnabled) {
        finalizePreviewEditingSession(false);
        rightEditingEnabled = false;
        activeEditingSurface = "source";
        savedPreviewRange = null;
        activePreviewBlockId = "";
        await renderNow();
        setStatus("右侧编辑已关闭");
      } else {
        rightEditingEnabled = true;
        await renderNow();
        setStatus(
          "右侧编辑已开启；普通文字可直接修改，" +
          "公式和图片可双击编辑"
        );
      }

      setRightEditButtonState();
      scheduleDraftSave();
    }

    function extractFormulaBlockData(raw) {
      const text = String(raw || "").trim();
      let match = text.match(
        /^\$\$\s*\n?([\s\S]*?)\n?\s*\$\$(?:\s*(<!--[\s\S]*?-->))?$/
      );

      if (!match) {
        match = text.match(
          /^\\\[\s*\n?([\s\S]*?)\n?\s*\\\](?:\s*(<!--[\s\S]*?-->))?$/
        );
      }

      if (!match) return null;

      const marker = parseEquationNumberingMarker(
        match[2] || ""
      );

      return {
        latex: match[1].replace(/^\n+|\n+$/g, ""),
        mode:
          marker.mode === "custom"
            ? "custom"
            : marker.mode === "no-number"
              ? "no-number"
              : "plain",
        label: marker.customLabel || ""
      };
    }

    function updateFormulaCustomLabelVisibility() {
      formulaCustomLabelField.classList.toggle(
        "is-hidden",
        formulaEditMode.value !== "custom"
      );
    }

    function openFormulaRightEditor(block) {
      const record = getPreviewBlockRecord(block);
      const data = record
        ? extractFormulaBlockData(record.raw)
        : null;

      if (!record || !data) {
        openSourceBlockRightEditor(block);
        return;
      }

      formulaEditDialog.dataset.blockId = record.id;
      formulaEditLatex.value = data.latex;
      formulaEditMode.value = data.mode;
      formulaEditLabel.value = data.label;
      updateFormulaCustomLabelVisibility();
      formulaEditDialog.showModal();
      formulaEditLatex.focus();
    }

    function saveFormulaFromRightEditor() {
      const record = getPreviewBlockRecord(
        formulaEditDialog.dataset.blockId
      );

      if (!record) {
        formulaEditDialog.close();
        return;
      }

      const latex = formulaEditLatex.value
        .replace(/^\n+|\n+$/g, "");
      const mode = formulaEditMode.value;
      let marker = "";

      if (mode === "no-number") {
        marker = " <!-- eq:no-number -->";
      } else if (mode === "custom") {
        const label = sanitizeCustomEquationLabel(
          formulaEditLabel.value
        );

        if (!label) {
          alert("请填写自定义编号或标签。");
          formulaEditLabel.focus();
          return;
        }

        marker = ` <!-- eq:label=${label} -->`;
      }

      const core = `$$\n${latex}\n$$${marker}`;
      const nextRaw = preservePreviewBlockWhitespace(
        record.raw,
        core
      );

      formulaEditDialog.close();
      replaceMappedPreviewBlockSource(
        record,
        nextRaw,
        {
          recordHistory: true,
          render: true
        }
      );
    }

    function parseEditableImage(raw) {
      const source = String(raw || "");
      const matches = Array.from(
        source.matchAll(
          /!\[([^\]\n]*)\](\([^\n)]*\)|\[[^\]\n]*\])(?:\s*\{([^{}\n]*)\})?/g
        )
      );

      if (matches.length !== 1) return null;

      const match = matches[0];
      const attributes = parseImageSizingAttributes(
        match[3] || ""
      );

      return {
        full: match[0],
        start: match.index,
        end: match.index + match[0].length,
        alt: match[1] || "",
        target: match[2],
        width: attributes.width,
        height: attributes.height,
        rotate: attributes.rotate
      };
    }

    function openImageRightEditor(block) {
      const record = getPreviewBlockRecord(block);
      const data = record
        ? parseEditableImage(record.raw)
        : null;

      if (!record || !data) {
        openSourceBlockRightEditor(block);
        return;
      }

      imageEditDialog.dataset.blockId = record.id;
      imageEditAlt.value = data.alt;
      imageEditWidth.value = data.width;
      imageEditHeight.value = data.height;
      imageEditRotate.value = String(data.rotate);
      imageEditDialog.showModal();
      imageEditAlt.focus();
    }

    function saveImageFromRightEditor() {
      const record = getPreviewBlockRecord(
        imageEditDialog.dataset.blockId
      );
      const data = record
        ? parseEditableImage(record.raw)
        : null;

      if (!record || !data) {
        imageEditDialog.close();
        return;
      }

      const alt = sanitizeImageAlt(
        imageEditAlt.value || "图片"
      );
      const width = normalizeImageDimension(
        imageEditWidth.value,
        "100%"
      );
      const height = normalizeImageDimension(
        imageEditHeight.value,
        "auto"
      );
      const rotate = normalizeImageRotation(
        imageEditRotate.value
      );
      const replacement =
        `![${alt}]${data.target}` +
        `{width=${width} height=${height} rotate=${rotate}}`;
      const nextRaw =
        record.raw.slice(0, data.start) +
        replacement +
        record.raw.slice(data.end);

      imageEditDialog.close();
      replaceMappedPreviewBlockSource(
        record,
        nextRaw,
        {
          recordHistory: true,
          render: true
        }
      );
    }

    function openSourceBlockRightEditor(block) {
      const record = getPreviewBlockRecord(block);
      if (!record) return;

      sourceBlockEditDialog.dataset.blockId = record.id;
      sourceBlockEditText.value = record.raw;
      sourceBlockEditDialog.showModal();
      sourceBlockEditText.focus();
    }

    function saveSourceBlockFromRightEditor() {
      const record = getPreviewBlockRecord(
        sourceBlockEditDialog.dataset.blockId
      );

      if (!record) {
        sourceBlockEditDialog.close();
        return;
      }

      const nextRaw = sourceBlockEditText.value;
      sourceBlockEditDialog.close();
      replaceMappedPreviewBlockSource(
        record,
        nextRaw,
        {
          recordHistory: true,
          render: true
        }
      );
    }

    function closeRightEditDialog(type) {
      const dialogs = {
        formula: formulaEditDialog,
        image: imageEditDialog,
        source: sourceBlockEditDialog
      };

      dialogs[type]?.close();
    }

    function undoRightEdit() {
      const action = rightEditUndoStack.pop();
      if (!action) return false;

      rightEditRedoStack.push(action);
      editor.value = action.before;
      lastEditOrigin = "preview";
      scheduleDraftSave();
      renderNow();
      setStatus("已撤销右侧编辑");

      return true;
    }

    function redoRightEdit() {
      const action = rightEditRedoStack.pop();
      if (!action) return false;

      rightEditUndoStack.push(action);
      editor.value = action.after;
      lastEditOrigin = "preview";
      scheduleDraftSave();
      renderNow();
      setStatus("已反撤销右侧编辑");

      return true;
    }

    function isPrimaryShortcut(event) {
      return event.ctrlKey || event.metaKey;
    }

    function openToolbarMenuById(id) {
      const menu = document.getElementById(id);

      if (!menu) return;

      closeToolbarMenus(menu);
      menu.setAttribute("open", "");

      requestAnimationFrame(() => {
        positionToolbarMenuPanel(menu);
        menu.querySelector("summary")?.focus();
      });
    }

    function handleGlobalEditorShortcut(event) {
      const primary = isPrimaryShortcut(event);
      const key = String(event.key || "").toLowerCase();
      const editorFocused = document.activeElement === editor;
      const previewFocused =
        rightEditingEnabled &&
        Boolean(
          getPreviewBlockElement(
            document.activeElement
          )
        );
      const code = event.code;

      if (primary && !event.altKey && !event.shiftKey && key === "s") {
        event.preventDefault();
        saveVersion();
        return;
      }

      if (primary && event.shiftKey && !event.altKey && key === "s") {
        event.preventDefault();
        writeCurrentProjectIntoSource();
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "o") {
        event.preventDefault();
        openMarkdownPicker();
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "n") {
        event.preventDefault();
        newMarkdownDocument();
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "p") {
        event.preventDefault();
        printDocumentWithPageNumbers();
        return;
      }

      if (primary && event.shiftKey && !event.altKey && key === "r") {
        event.preventDefault();
        restoreSavedVersion();
        return;
      }

      if (
        primary &&
        event.altKey &&
        !event.shiftKey &&
        event.key === "Backspace"
      ) {
        event.preventDefault();
        clearCurrentProjectData();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "e") {
        event.preventDefault();
        openToolbarMenuById("exportMenu");
        return;
      }

      if (
        primary &&
        event.altKey &&
        event.shiftKey &&
        key === "m"
      ) {
        event.preventDefault();
        downloadMarkdown();
        return;
      }

      if (
        primary &&
        event.altKey &&
        event.shiftKey &&
        key === "h"
      ) {
        event.preventDefault();
        downloadRenderedHTML();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "r") {
        event.preventDefault();
        toggleRealtimeRender();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "s") {
        event.preventDefault();
        toggleSyncScroll();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "w") {
        event.preventDefault();
        toggleRightEditing();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "m") {
        event.preventDefault();
        expandMetadataBar();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "f") {
        event.preventDefault();
        toggleFormattingToolbar();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "g") {
        event.preventDefault();
        toggleFormattingToolbarPin();
        return;
      }

      if (
        previewFocused &&
        primary &&
        !event.altKey &&
        !event.shiftKey &&
        key === "z"
      ) {
        event.preventDefault();
        undoEdit();
        return;
      }

      if (
        previewFocused &&
        primary &&
        event.shiftKey &&
        !event.altKey &&
        key === "z"
      ) {
        event.preventDefault();
        redoEdit();
        return;
      }

      if (!editorFocused && !previewFocused) return;

      if (
        event.altKey &&
        !primary &&
        (event.key === "=" || event.key === "+")
      ) {
        event.preventDefault();
        insertEquationTemplate(
          event.shiftKey ? "no-number" : "plain"
        );
        return;
      }

      if (
        primary &&
        event.altKey &&
        (event.key === "=" || event.key === "+")
      ) {
        event.preventDefault();
        insertCustomNumberedEquation();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "n") {
        event.preventDefault();
        cycleEquationNumberingMode();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "i") {
        event.preventDefault();
        openImagePicker();
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "b") {
        event.preventDefault();
        toggleInlineFormat("**", "**", "加粗文字");
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "i") {
        event.preventDefault();
        toggleInlineFormat("*", "*", "斜体文字");
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "u") {
        event.preventDefault();
        toggleInlineFormat("<u>", "</u>", "下划线文字");
        return;
      }

      if (primary && event.shiftKey && !event.altKey && key === "x") {
        event.preventDefault();
        toggleInlineFormat("~~", "~~", "删除线文字");
        return;
      }

      if (primary && !event.altKey && !event.shiftKey && key === "k") {
        event.preventDefault();
        insertLinkFormatting();
        return;
      }

      if (
        primary &&
        !event.altKey &&
        !event.shiftKey &&
        (event.key === "`" || code === "Backquote")
      ) {
        event.preventDefault();
        insertCodeFormatting();
        return;
      }

      if (
        primary &&
        event.shiftKey &&
        !event.altKey &&
        (event.key === ">" || code === "Period")
      ) {
        event.preventDefault();
        adjustSelectedFontSize(1);
        return;
      }

      if (
        primary &&
        event.shiftKey &&
        !event.altKey &&
        (event.key === "<" || code === "Comma")
      ) {
        event.preventDefault();
        adjustSelectedFontSize(-1);
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "c") {
        event.preventDefault();
        document.getElementById("textColorInput")?.click();
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "h") {
        event.preventDefault();
        document.getElementById("backgroundColorInput")?.click();
        return;
      }

      if (primary && event.altKey && /^[0-6]$/.test(key)) {
        event.preventDefault();
        applyHeadingLevel(key);
        return;
      }

      if (
        primary &&
        event.shiftKey &&
        !event.altKey &&
        code === "Digit7"
      ) {
        event.preventDefault();
        toggleLinePrefix("ordered");
        return;
      }

      if (
        primary &&
        event.shiftKey &&
        !event.altKey &&
        code === "Digit8"
      ) {
        event.preventDefault();
        toggleLinePrefix("unordered");
        return;
      }

      if (
        primary &&
        event.shiftKey &&
        !event.altKey &&
        code === "Digit9"
      ) {
        event.preventDefault();
        toggleLinePrefix("quote");
        return;
      }

      if (primary && event.altKey && !event.shiftKey && key === "t") {
        event.preventDefault();
        toggleLinePrefix("task");
        return;
      }

      if (primary && event.shiftKey && !event.altKey) {
        const alignments = {
          l: "left",
          e: "center",
          r: "right",
          j: "justify"
        };

        if (alignments[key]) {
          event.preventDefault();
          applyTextAlignment(alignments[key]);
          return;
        }
      }

      if (
        primary &&
        event.altKey &&
        !event.shiftKey &&
        (event.key === "-" || code === "Minus")
      ) {
        event.preventDefault();
        insertHorizontalRule();
        return;
      }

      if (
        primary &&
        event.altKey &&
        event.shiftKey &&
        key === "t"
      ) {
        event.preventDefault();
        insertTableTemplate();
        return;
      }

      if (
        primary &&
        !event.altKey &&
        !event.shiftKey &&
        (event.key === "\\" || code === "Backslash")
      ) {
        event.preventDefault();
        clearSelectedFormatting();
      }
    }

    function rememberEditorSelection() {
      savedEditorSelection = {
        start: editor.selectionStart,
        end: editor.selectionEnd
      };
    }

    function getFormattingSelection() {
      const start = Number.isInteger(savedEditorSelection.start)
        ? savedEditorSelection.start
        : editor.selectionStart;
      const end = Number.isInteger(savedEditorSelection.end)
        ? savedEditorSelection.end
        : editor.selectionEnd;

      return {
        start: Math.max(0, Math.min(editor.value.length, start)),
        end: Math.max(0, Math.min(editor.value.length, end))
      };
    }

    function replaceEditorTextRange(
      start,
      end,
      replacement,
      nextSelectionStart,
      nextSelectionEnd = nextSelectionStart
    ) {
      let insertedWithHistory = false;
      const scrollTop = editor.scrollTop;
      const scrollLeft = editor.scrollLeft;

      editor.focus();
      editor.setSelectionRange(start, end);

      try {
        insertedWithHistory = document.execCommand(
          "insertText",
          false,
          replacement
        );
      } catch (error) {
        insertedWithHistory = false;
      }

      if (!insertedWithHistory) {
        editor.setRangeText(replacement, start, end, "end");
      }

      const safeStart = Math.max(
        0,
        Math.min(editor.value.length, nextSelectionStart)
      );
      const safeEnd = Math.max(
        safeStart,
        Math.min(editor.value.length, nextSelectionEnd)
      );

      editor.setSelectionRange(safeStart, safeEnd);
      editor.scrollTop = scrollTop;
      editor.scrollLeft = scrollLeft;
      rememberEditorSelection();
      scheduleRender();
      scheduleDraftSave();
    }

    function toggleInlineFormat(
      prefix,
      suffix,
      placeholder = "文字"
    ) {
      if (hasActivePreviewSelection()) {
        const commands = {
          "**|**": "bold",
          "*|*": "italic",
          "~~|~~": "strikeThrough",
          "<u>|</u>": "underline"
        };
        const command =
          commands[`${prefix}|${suffix}`];

        if (command) {
          applyPreviewInlineCommand(command);
        } else {
          wrapPreviewSelection(
            "span",
            {},
            placeholder
          );
        }

        return;
      }

      const { start, end } = getFormattingSelection();
      const selected = editor.value.slice(start, end);

      if (
        selected &&
        start >= prefix.length &&
        editor.value.slice(start - prefix.length, start) === prefix &&
        editor.value.slice(end, end + suffix.length) === suffix
      ) {
        const replacement = selected;

        replaceEditorTextRange(
          start - prefix.length,
          end + suffix.length,
          replacement,
          start - prefix.length,
          start - prefix.length + replacement.length
        );
        return;
      }

      const content = selected || placeholder;
      const replacement = prefix + content + suffix;
      const innerStart = start + prefix.length;
      const innerEnd = innerStart + content.length;

      replaceEditorTextRange(
        start,
        end,
        replacement,
        innerStart,
        innerEnd
      );
    }

    function applyInlineStyle(
      property,
      value,
      placeholder = "文字"
    ) {
      const allowedProperties = new Set([
        "font-size",
        "color",
        "background-color"
      ]);

      if (!allowedProperties.has(property) || !value) return;

      if (hasActivePreviewSelection()) {
        wrapPreviewSelection(
          "span",
          { [property]: value },
          placeholder
        );
        return;
      }

      const { start, end } = getFormattingSelection();
      const selected = editor.value.slice(start, end) || placeholder;
      const prefix = `<span style="${property}: ${value};">`;
      const suffix = "</span>";

      replaceEditorTextRange(
        start,
        end,
        prefix + selected + suffix,
        start + prefix.length,
        start + prefix.length + selected.length
      );
    }

    function applyFontSize(value) {
      if (!/^\d+(?:\.\d+)?(?:px|pt|em|rem|%)$/.test(value)) {
        return;
      }

      applyInlineStyle("font-size", value, "字号文字");
    }

    function adjustSelectedFontSize(direction) {
      const normalizedDirection = Number(direction);

      if (normalizedDirection !== 1 && normalizedDirection !== -1) {
        return;
      }

      applyInlineStyle(
        "font-size",
        normalizedDirection > 0 ? "larger" : "smaller",
        normalizedDirection > 0 ? "放大文字" : "缩小文字"
      );
    }

    function applyTextColor(value) {
      if (!/^#[0-9a-f]{6}$/i.test(value)) return;
      applyInlineStyle("color", value, "彩色文字");
    }

    function applyBackgroundColor(value) {
      if (!/^#[0-9a-f]{6}$/i.test(value)) return;
      applyInlineStyle("background-color", value, "高亮文字");
    }

    function getSelectedLineRange() {
      const { start, end } = getFormattingSelection();
      const lineStart = editor.value.lastIndexOf("\n", start - 1) + 1;
      const nextLineBreak = editor.value.indexOf("\n", end);
      const lineEnd =
        nextLineBreak === -1 ? editor.value.length : nextLineBreak;

      return {
        start: lineStart,
        end: lineEnd,
        selectedStart: start,
        selectedEnd: end,
        text: editor.value.slice(lineStart, lineEnd)
      };
    }

    function transformSelectedLines(transformer) {
      const range = getSelectedLineRange();
      const lines = range.text.split("\n");
      const transformed = lines.map(transformer).join("\n");

      replaceEditorTextRange(
        range.start,
        range.end,
        transformed,
        range.start,
        range.start + transformed.length
      );
    }

    function applyHeadingLevel(levelValue) {
      if (levelValue === "") return;

      if (applyPreviewHeadingLevel(levelValue)) {
        return;
      }

      const level = Number.parseInt(levelValue, 10);

      transformSelectedLines(line => {
        const content = line.replace(
          /^\s{0,3}#{1,6}\s+/,
          ""
        );

        if (!level) return content;

        return (
          `${"#".repeat(
            Math.min(6, Math.max(1, level))
          )} ${content}`
        );
      });
    }

    function toggleLinePrefix(type) {
      if (applyPreviewListType(type)) {
        return;
      }

      const range = getSelectedLineRange();
      const lines = range.text.split("\n");
      const nonEmptyLines = lines.filter(line => line.trim());

      const patterns = {
        quote: /^\s*>\s?/,
        unordered: /^\s*[-*+]\s+/,
        ordered: /^\s*\d+[.)]\s+/,
        task: /^\s*[-*+]\s+\[[ xX]\]\s+/
      };

      const pattern = patterns[type];
      if (!pattern) return;

      const allHavePrefix =
        nonEmptyLines.length > 0 &&
        nonEmptyLines.every(line => pattern.test(line));

      let order = 1;
      const transformed = lines.map(line => {
        if (!line.trim()) return line;

        if (allHavePrefix) {
          return line.replace(pattern, "");
        }

        const clean = line
          .replace(/^\s*>\s?/, "")
          .replace(/^\s*[-*+]\s+\[[ xX]\]\s+/, "")
          .replace(/^\s*[-*+]\s+/, "")
          .replace(/^\s*\d+[.)]\s+/, "");

        if (type === "quote") return `> ${clean}`;
        if (type === "unordered") return `- ${clean}`;
        if (type === "task") return `- [ ] ${clean}`;

        const value = `${order}. ${clean}`;
        order += 1;
        return value;
      }).join("\n");

      replaceEditorTextRange(
        range.start,
        range.end,
        transformed,
        range.start,
        range.start + transformed.length
      );
    }

    const markdownIndentSpanPattern =
      /^<span\s+data-md-indent="(\d+)"\s+style="display:\s*inline-block;\s*margin-left:\s*(\d+(?:\.\d+)?)em;">([\s\S]*)<\/span>$/i;

    function splitMarkdownLinePrefix(line) {
      const original = String(line || "");

      /*
       * Preserve structural Markdown prefixes so headings, lists,
       * tasks and blockquotes remain the same kind of block.
       */
      const heading = original.match(/^(\s{0,3}#{1,6}\s+)([\s\S]*)$/);
      if (heading) {
        return {
          prefix: heading[1],
          content: heading[2]
        };
      }

      const task = original.match(
        /^(\s{0,3}[-*+]\s+\[[ xX]\]\s+)([\s\S]*)$/
      );
      if (task) {
        return {
          prefix: task[1],
          content: task[2]
        };
      }

      const unordered = original.match(
        /^(\s{0,3}[-*+]\s+)([\s\S]*)$/
      );
      if (unordered) {
        return {
          prefix: unordered[1],
          content: unordered[2]
        };
      }

      const ordered = original.match(
        /^(\s{0,3}\d+[.)]\s+)([\s\S]*)$/
      );
      if (ordered) {
        return {
          prefix: ordered[1],
          content: ordered[2]
        };
      }

      const quote = original.match(
        /^((?:\s{0,3}>\s*)+)([\s\S]*)$/
      );
      if (quote) {
        return {
          prefix: quote[1],
          content: quote[2]
        };
      }

      return {
        prefix: "",
        content: original
      };
    }

    function readMarkdownIndentContent(content) {
      const normalized = String(content || "");
      const match = normalized.match(markdownIndentSpanPattern);

      if (!match) {
        return {
          level: 0,
          content: normalized
        };
      }

      return {
        level: Math.max(
          0,
          Number.parseInt(match[1], 10) || 0
        ),
        content: match[3]
      };
    }

    function buildMarkdownIndentContent(content, level) {
      const safeLevel = Math.max(
        0,
        Math.min(12, Number.parseInt(level, 10) || 0)
      );

      if (!safeLevel) return String(content || "");

      const margin = safeLevel * 2;

      return (
        `<span data-md-indent="${safeLevel}" ` +
        `style="display: inline-block; ` +
        `margin-left: ${margin}em;">` +
        `${String(content || "")}</span>`
      );
    }

    function adjustMarkdownLineIndent(line, direction) {
      const original = String(line || "");

      if (!original.trim()) return original;

      /*
       * Do not alter fenced-code delimiters. The code itself remains
       * untouched because indentation is a text-layout operation.
       */
      if (/^\s*(`{3,}|~{3,})/.test(original)) {
        return original;
      }

      const { prefix, content } =
        splitMarkdownLinePrefix(original);
      const current = readMarkdownIndentContent(content);
      const nextLevel = Math.max(
        0,
        Math.min(
          12,
          current.level + (direction > 0 ? 1 : -1)
        )
      );

      /*
       * Also clean up legacy leading-space indentation from earlier
       * versions when decreasing indentation.
       */
      if (
        direction < 0 &&
        current.level === 0 &&
        !prefix
      ) {
        return original.replace(/^(?: {1,4}|\t)/, "");
      }

      return (
        prefix +
        buildMarkdownIndentContent(
          current.content,
          nextLevel
        )
      );
    }

    function adjustMarkdownBlockIndent(source, direction) {
      let insideFence = false;
      let fenceCharacter = "";
      let fenceLength = 0;

      return String(source || "")
        .split("\n")
        .map(line => {
          const fenceMatch = line
            .trim()
            .match(/^(`{3,}|~{3,})/);

          if (fenceMatch) {
            const marker = fenceMatch[1];
            const character = marker[0];

            if (!insideFence) {
              insideFence = true;
              fenceCharacter = character;
              fenceLength = marker.length;
            } else if (
              character === fenceCharacter &&
              marker.length >= fenceLength
            ) {
              insideFence = false;
              fenceCharacter = "";
              fenceLength = 0;
            }

            return line;
          }

          if (insideFence) return line;

          return adjustMarkdownLineIndent(
            line,
            direction
          );
        })
        .join("\n");
    }

    function changeIndent(direction) {
      if (applyPreviewIndent(direction)) {
        return;
      }

      transformSelectedLines(line =>
        adjustMarkdownLineIndent(line, direction)
      );
    }

    function applyTextAlignment(alignment) {
      if (!["left", "center", "right", "justify"].includes(alignment)) {
        return;
      }

      if (applyPreviewAlignment(alignment)) {
        return;
      }

      const { start, end } = getFormattingSelection();
      const range = start === end
        ? getSelectedLineRange()
        : {
            start,
            end,
            text: editor.value.slice(start, end)
          };
      const content = range.text || "对齐文字";
      const prefix =
        `<div style="text-align: ${alignment};">`;
      const suffix = "</div>";

      replaceEditorTextRange(
        range.start,
        range.end,
        prefix + content + suffix,
        range.start + prefix.length,
        range.start + prefix.length + content.length
      );
    }

    function insertCodeFormatting() {
      if (hasActivePreviewSelection()) {
        const block = restorePreviewSelection();

        if (!block || !savedPreviewRange) return;

        if (
          savedPreviewRange.toString().includes("\n")
        ) {
          wrapPreviewSelection(
            "code",
            {},
            "代码"
          );
        } else {
          wrapPreviewSelection(
            "code",
            {},
            "代码"
          );
        }

        return;
      }

      const { start, end } = getFormattingSelection();
      const selected = editor.value.slice(start, end);

      if (selected.includes("\n")) {
        const content = selected || "代码";
        const prefix = "```\n";
        const suffix = "\n```";

        replaceEditorTextRange(
          start,
          end,
          prefix + content + suffix,
          start + prefix.length,
          start + prefix.length + content.length
        );
        return;
      }

      toggleInlineFormat("`", "`", "代码");
    }

    function insertLinkFormatting() {
      if (hasActivePreviewSelection()) {
        const url = window.prompt(
          "请输入链接地址：",
          "https://"
        );

        if (!url) return;

        const block = restorePreviewSelection();
        if (!block || !savedPreviewRange) return;

        if (savedPreviewRange.collapsed) {
          const text =
            window.prompt(
              "请输入链接文字：",
              "链接文字"
            ) || "链接文字";
          const link = document.createElement("a");
          link.href = url;
          link.textContent = text;
          savedPreviewRange.insertNode(link);
          selectPreviewElementContents(link);
        } else {
          applyPreviewInlineCommand(
            "createLink",
            url
          );
        }

        schedulePreviewBlockCommit(
          getPreviewBlockElement() || block
        );
        return;
      }

      const { start, end } = getFormattingSelection();
      const selected = editor.value.slice(start, end);
      const url = window.prompt(
        "请输入链接地址：",
        "https://"
      );

      if (!url) return;

      const text = selected || window.prompt(
        "请输入链接文字：",
        "链接文字"
      ) || "链接文字";
      const replacement = `[${text}](${url})`;

      replaceEditorTextRange(
        start,
        end,
        replacement,
        start + 1,
        start + 1 + text.length
      );
    }

    function insertHorizontalRule() {
      if (hasActivePreviewSelection()) {
        insertSourceAfterActivePreviewBlock(
          "\n---\n"
        );
        return;
      }

      const { start, end } = getFormattingSelection();
      const before =
        start > 0 &&
        editor.value[start - 1] !== "\n"
          ? "\n\n"
          : "";
      const replacement = `${before}---\n`;

      replaceEditorTextRange(
        start,
        end,
        replacement,
        start + replacement.length
      );
    }

    function insertTableTemplate() {
      const template =
        "| 标题 1 | 标题 2 | 标题 3 |\n" +
        "|---|---|---|\n" +
        "| 内容 | 内容 | 内容 |\n";

      if (hasActivePreviewSelection()) {
        insertSourceAfterActivePreviewBlock(
          `\n${template}`
        );
        return;
      }

      const { start, end } = getFormattingSelection();
      const before =
        start > 0 &&
        editor.value[start - 1] !== "\n"
          ? "\n\n"
          : "";

      replaceEditorTextRange(
        start,
        end,
        before + template,
        start + before.length + 2,
        start + before.length + 6
      );
    }

    function clearSelectedFormatting() {
      if (hasActivePreviewSelection()) {
        const block = restorePreviewSelection();

        if (!block) return;

        try {
          document.execCommand(
            "removeFormat",
            false,
            null
          );
          document.execCommand(
            "unlink",
            false,
            null
          );
        } catch (error) {
          console.error(error);
        }

        block
          .querySelectorAll(
            "span[style], u, mark"
          )
          .forEach(element => {
            element.replaceWith(
              ...element.childNodes
            );
          });

        savePreviewSelection();
        schedulePreviewBlockCommit(block);
        return;
      }

      const { start, end } = getFormattingSelection();
      const selected = editor.value.slice(start, end);

      if (!selected) {
        setStatus("请先选择要清除格式的文字");
        return;
      }

      const cleaned = selected
        .replace(
          /<\/?(?:span|u|strong|em|del|mark)(?:\s[^>]*)?>/gi,
          ""
        )
        .replace(/(\*\*|__|~~|`)/g, "")
        .replace(/^\s{0,3}#{1,6}\s+/gm, "")
        .replace(/^\s*>\s?/gm, "");

      replaceEditorTextRange(
        start,
        end,
        cleaned,
        start,
        start + cleaned.length
      );
    }

    function resetEditorToSource(source, statusText) {
      applyingStoredState = true;

      try {
        localStorage.removeItem(draftStorageKey);
        localStorage.removeItem(versionStorageKey);

        editor.value = String(source || "");
        authorInput.value = "";
        dateInput.value = formatRenderDate(new Date());
        autoDateCheckbox.checked = true;
        equationNumberingCheckbox.checked = true;
        defaultNumberedEquationCheckbox.checked = true;
        updateEquationNumberingButton();
        formattingToolbarPinned = false;
        formattingToolbarOpen = false;
        rightEditingEnabled = false;
        rightEditUndoStack = [];
        rightEditRedoStack = [];
        lastEditOrigin = "source";
        metadataForcedOpen = false;
        setRightEditButtonState();
        updateFormattingToolbarState();
        editor.scrollTop = 0;
        editor.scrollLeft = 0;
        editor.setSelectionRange(0, 0);
        rememberEditorSelection();

        updateMetadataCompactSummary();
        updateMetadataBarCollapse();
        renderNow();
      } finally {
        applyingStoredState = false;
      }

      saveDraftNow(false);
      setStatus(statusText);
    }

    function newMarkdownDocument() {
      closeToolbarMenus();

      const confirmed = window.confirm(
        "新建文档会替换当前编辑区，并清除当前项目的草稿与稳定版本。\n" +
        "需要保留当前内容时，请先点击“写入源码”或导出。确定继续吗？"
      );

      if (!confirmed) return;

      resetEditorToSource("# 未命名文档\n\n", "已新建文档");
    }

    function openMarkdownPicker() {
      closeToolbarMenus();
      markdownFileInput.value = "";
      markdownFileInput.click();
    }

    async function loadMarkdownFile(file) {
      if (!file) return;

      const confirmed = window.confirm(
        `打开“${file.name}”会替换当前编辑区，并清除当前项目的草稿与稳定版本。\n` +
        "需要保留当前内容时，请先取消并执行“写入源码”。确定继续吗？"
      );

        );
