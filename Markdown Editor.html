  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --border: #d8dde6;

      --accent: #365f9d;
      --soft: #f6f8fb;

    * {

    }

    html, body {
      height: 100%;

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 3px;
      min-height: 46px;
      padding: 6px 8px;
      overflow-x: auto;
      overflow-y: hidden;
      background: #2f5597;
      border-bottom: 1px solid #24477f;
      color: #fff;

      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
    }

    .toolbar::-webkit-scrollbar {
      height: 5px;
    }

    .toolbar::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
    }


    button {
      padding: 6px 10px;
      border: 1px solid #bcc4d0;
      border-radius: 7px;
      background: white;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }

    button:hover {
      background: var(--soft);
    }

    .icon-button {
      position: relative;
      width: 32px;
      height: 30px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      top: calc(100% + 7px);
      transform: translateX(-50%) translateY(-2px);
      z-index: 100;
      padding: 5px 8px;
      border-radius: 5px;
      background: #20242b;
      color: #fff;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 120ms ease,
        transform 120ms ease,
        visibility 120ms ease;
    }

    .icon-button:hover::after,
    .icon-button:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .legacy-export-menu-unused {
      position: relative;
      flex: 0 0 auto;
    }

    .legacy-export-menu-unused > summary {
      list-style: none;
      padding: 6px 28px 6px 10px;
      border: 1px solid #bcc4d0;
      border-radius: 7px;
      background: white;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      line-height: normal;
      user-select: none;
    }

    .legacy-export-menu-unused > summary::-webkit-details-marker {
      display: none;
    }

    .legacy-export-menu-unused > summary::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 10px;
      width: 6px;
      height: 6px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: translateY(-65%) rotate(45deg);
      transition: transform 120ms ease;
    }

    .legacy-export-menu-unused[open] > summary::after {
      transform: translateY(-30%) rotate(225deg);
    }

    .legacy-export-menu-unused > summary:hover,
    .legacy-export-menu-unused[open] > summary {
      background: var(--soft);
    }

    .legacy-export-menu-unused > summary:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 2px;
    }

    .legacy-export-menu-panel-unused {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 120;
      display: grid;
      min-width: 132px;

      background: var(--soft);
    }

    .toc-sidebar {

      z-index: 40;
      top: var(--toolbar-height, 45px);

<body>
  <div class="app">
    <div class="toolbar" id="mainToolbar">
      <div class="toolbar-row toolbar-row-primary">
        <details class="file-menu toolbar-menu" id="fileMenu" data-menu-align="start">
          <summary class="toolbar-icon-button" aria-label="文件菜单" title="文件菜单（Ctrl + N 新建；Ctrl + O 打开）">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </summary>
          <div class="toolbar-menu-panel file-menu-panel" role="menu" style="top: 40px; left: 6px; right: auto;">
            <button type="button" role="menuitem" title="新建文档（Ctrl + N）" onclick="newMarkdownDocument()">新建文档　Ctrl + N</button>
            <button type="button" role="menuitem" title="打开 Markdown（Ctrl + O）" onclick="openMarkdownPicker()">打开 Markdown　Ctrl + O</button>
          </div>
        </details>

        <button class="toolbar-text-button" id="realtimeButton" onclick="toggleRealtimeRender()" title="实时渲染开关（Ctrl + Alt + R）">实时渲染：开</button>
        <button class="toolbar-text-button" id="syncScrollButton" onclick="toggleSyncScroll()" title="同步滚动开关（Ctrl + Alt + S）">同步滚动：开</button>

        <button class="toolbar-text-button" id="rightEditButton" onclick="toggleRightEditing()" title="右侧可视化编辑开关（Ctrl + Alt + W）" aria-pressed="false">右侧编辑：关</button>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <button class="toolbar-icon-button" onclick="undoEdit()" aria-label="撤销" title="撤销（Ctrl + Z）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 7H5V3"></path>
            <path d="M5.2 7.1A8 8 0 1 1 7 18.4"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button" onclick="redoEdit()" aria-label="反撤销" title="反撤销（Ctrl + Shift + Z）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 7h4V3"></path>
            <path d="M18.8 7.1A8 8 0 1 0 17 18.4"></path>
          </svg>
        </button>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <button class="toolbar-text-button formatting-toolbar-toggle" id="formattingToolbarToggle" type="button" aria-expanded="false" title="展开或收起文本编辑工具栏（Ctrl + Alt + F）" onclick="toggleFormattingToolbar()">
          <span>文本编辑</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 9 5 5 5-5"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button formatting-toolbar-pin" id="formattingToolbarPin" type="button" aria-pressed="false" aria-label="固定文本编辑工具栏" title="固定文本编辑工具栏（Ctrl + Alt + G）" onclick="toggleFormattingToolbarPin()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m14 4 6 6-3 1-4 4v4l-2 2-2-6-6-2 2-2h4l4-4z"></path>
          </svg>
        </button>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <button class="toolbar-text-button" onclick="saveVersion()" title="保存稳定版本（Ctrl + S）">保存</button>
        <button class="toolbar-text-button" onclick="restoreSavedVersion()" title="恢复稳定版本（Ctrl + Shift + R）">恢复版本</button>
        <button class="toolbar-text-button" onclick="clearCurrentProjectData()" title="清空当前项目（Ctrl + Alt + Backspace）">清空</button>
        <button class="toolbar-text-button" onclick="writeCurrentProjectIntoSource()" title="将当前项目写入新的 HTML 源码（Ctrl + Shift + S）">写入源码</button>

        <details class="export-menu toolbar-menu" id="exportMenu" data-menu-align="end">
          <summary class="toolbar-text-button export-summary" aria-label="打开导出菜单" title="导出菜单（Ctrl + Alt + E）">导出</summary>
          <div class="toolbar-menu-panel export-menu-panel" role="menu">
            <button type="button" role="menuitem" title="导出 Markdown（Ctrl + Alt + Shift + M）" onclick="downloadMarkdown(); closeToolbarMenus()">Markdown　Ctrl + Alt + Shift + M</button>
            <button type="button" role="menuitem" title="导出 HTML（Ctrl + Alt + Shift + H）" onclick="downloadRenderedHTML(); closeToolbarMenus()">HTML　Ctrl + Alt + Shift + H</button>
            <button type="button" role="menuitem" title="打印或导出 PDF（Ctrl + P）" onclick="printDocumentWithPageNumbers(); closeToolbarMenus()">PDF　Ctrl + P</button>
          </div>
        </details>

        

        <span class="status" id="status">准备就绪</span>
      </div>

      <div class="formatting-toolbar-shell is-collapsed" id="formattingToolbarShell">
        <div class="toolbar-row toolbar-row-formatting" id="formattingToolbarRow">
        <button class="toolbar-icon-button format-action" onclick="toggleInlineFormat('**', '**', '加粗文字')" aria-label="加粗" title="加粗（Ctrl + B）"><strong>B</strong></button>
        <button class="toolbar-icon-button format-action" onclick="toggleInlineFormat('*', '*', '斜体文字')" aria-label="斜体" title="斜体（Ctrl + I）"><em>I</em></button>
        <button class="toolbar-icon-button format-action" onclick="toggleInlineFormat('~~', '~~', '删除线文字')" aria-label="删除线" title="删除线（Ctrl + Shift + X）"><span class="strike-icon">S</span></button>
        <button class="toolbar-icon-button format-action" onclick="toggleInlineFormat('&lt;u&gt;', '&lt;/u&gt;', '下划线文字')" aria-label="下划线" title="下划线（Ctrl + U）"><span class="underline-icon">U</span></button>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <select class="toolbar-select compact-icon-select heading-icon-select" id="headingFormatSelect" title="标题级别（Ctrl + Alt + 0～6）" aria-label="标题级别" onchange="applyHeadingLevel(this.value); this.selectedIndex = 0">
          <option value="">H</option>
          <option value="0">正文</option>
          <option value="1">H1</option>
          <option value="2">H2</option>
          <option value="3">H3</option>
          <option value="4">H4</option>
          <option value="5">H5</option>
          <option value="6">H6</option>
        </select>

        <select class="toolbar-select compact-size-select" id="fontSizeSelect" title="设置具体字号（Ctrl + Shift + . 增大；Ctrl + Shift + , 减小）" aria-label="字号" onchange="applyFontSize(this.value); this.selectedIndex = 0">
          <option value="">字号</option>
          <option value="10px">10</option>
          <option value="12px">12</option>
          <option value="14px">14</option>
          <option value="16px">16</option>
          <option value="18px">18</option>
          <option value="20px">20</option>
          <option value="24px">24</option>
          <option value="28px">28</option>
          <option value="32px">32</option>
          <option value="36px">36</option>
          <option value="48px">48</option>
          <option value="64px">64</option>
        </select>

        <button class="toolbar-icon-button format-action font-step-button" onclick="adjustSelectedFontSize(1)" aria-label="增大字号" title="增大所选文字字号（Ctrl + Shift + .）"><span>T<sup>+</sup></span></button>
        <button class="toolbar-icon-button format-action font-step-button" onclick="adjustSelectedFontSize(-1)" aria-label="减小字号" title="减小所选文字字号（Ctrl + Shift + ,）"><span>T<sup>−</sup></span></button>

        <label class="toolbar-color-control" title="文字颜色（Ctrl + Alt + C）" aria-label="文字颜色">
          <span class="color-letter color-letter-foreground">A</span>
          <input id="textColorInput" type="color" value="#c62828" aria-label="选择文字颜色" onchange="applyTextColor(this.value)">
        </label>
        <label class="toolbar-color-control" title="背景颜色（Ctrl + Alt + H）" aria-label="背景颜色">
          <span class="color-letter color-letter-background">A</span>
          <input id="backgroundColorInput" type="color" value="#fff59d" aria-label="选择背景颜色" onchange="applyBackgroundColor(this.value)">
        </label>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <div class="toolbar-split-button" aria-label="插入公式">
          <button class="toolbar-icon-button format-action equation-main-button" onclick="insertEquationTemplate('plain')" aria-label="插入普通公式" title="插入普通行间公式（Alt + =）">
            <span class="equation-symbol">∑</span>
          </button>
          <details class="toolbar-menu split-menu" id="equationInsertMenu" data-menu-align="start">
            <summary class="toolbar-icon-button split-menu-summary" aria-label="选择公式类型" title="选择公式类型（Alt + = 普通；Alt + Shift + = 无编号；Ctrl + Alt + = 自定义编号）">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 9 5 5 5-5"></path>
              </svg>
            </summary>
            <div class="toolbar-menu-panel equation-menu-panel" role="menu">
              <button type="button" role="menuitem" title="普通公式（Alt + =）" onclick="insertEquationTemplate('plain'); closeToolbarMenus()">普通公式　Alt + =</button>
              <button type="button" role="menuitem" title="无编号公式（Alt + Shift + =）" onclick="insertEquationTemplate('no-number'); closeToolbarMenus()">无编号公式　Alt + Shift + =</button>
              <button type="button" role="menuitem" title="自定义编号公式（Ctrl + Alt + =）" onclick="insertCustomNumberedEquation(); closeToolbarMenus()">自定义编号公式　Ctrl + Alt + =</button>
            </div>
          </details>
        </div>

        <details class="toolbar-menu" id="equationNumberingMenu" data-menu-align="start">
          <summary class="toolbar-icon-button equation-numbering-button" id="equationNumberingButton" aria-label="公式编号模式" title="公式编号：按章节 x.x（Ctrl + Alt + N 循环切换）" data-mode="chapter">
            <span class="equation-numbering-icon">№</span>
            <span class="toolbar-icon-badge" id="equationNumberingBadge" aria-hidden="true">x.x</span>
          </summary>
          <div class="toolbar-menu-panel equation-numbering-panel" role="menu">
            <button type="button" role="menuitem" title="不显示公式编号" onclick="setEquationNumberingMode('none'); closeToolbarMenus()">不显示</button>
            <button type="button" role="menuitem" title="按照正文章节编号，例如 1.1、1.2、2.1" onclick="setEquationNumberingMode('chapter'); closeToolbarMenus()">以章节编号 x.x</button>
            <button type="button" role="menuitem" title="按照全文顺序连续编号，例如 1、2、3" onclick="setEquationNumberingMode('sequence'); closeToolbarMenus()">以顺序编号</button>
          </div>
        </details>

        <button class="toolbar-icon-button format-action image-toolbar-button" onclick="openImagePicker()" aria-label="插入图片" title="插入图片（Ctrl + Alt + I）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="8.2" cy="9" r="1.5"></circle>
            <path d="m4.5 17 5-5 3.2 3.2 2.1-2.1 4.7 3.9"></path>
          </svg>
        </button>

        <input id="equationNumberingCheckbox" type="checkbox" checked="" hidden="">
        <input id="defaultNumberedEquationCheckbox" type="checkbox" checked="" hidden="">

        <span class="toolbar-separator" aria-hidden="true"></span>

        <button class="toolbar-icon-button format-action" onclick="insertCodeFormatting()" aria-label="代码" title="行内代码或代码块（Ctrl + `）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="insertLinkFormatting()" aria-label="链接" title="插入链接（Ctrl + K）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path>
            <path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="toggleLinePrefix('quote')" aria-label="引用" title="引用（Ctrl + Shift + 9）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8H4v5h4v3H4M17 8h-3v5h4v3h-4"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="toggleLinePrefix('unordered')" aria-label="无序列表" title="无序列表（Ctrl + Shift + 8）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="6" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
            <circle cx="5" cy="18" r="1"></circle>
            <path d="M9 6h11M9 12h11M9 18h11"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="toggleLinePrefix('ordered')" aria-label="有序列表" title="有序列表（Ctrl + Shift + 7）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h2v4M4 9h3M4 14h2l-2 3h3M10 6h10M10 12h10M10 18h10"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="toggleLinePrefix('task')" aria-label="任务列表" title="任务列表（Ctrl + Alt + T）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="5" height="5" rx="1"></rect>
            <path d="m4.5 6.5 1 1 2-2M11 6.5h10M3 15h5v5H3zM11 17.5h10"></path>
          </svg>
        </button>

        <span class="toolbar-separator" aria-hidden="true"></span>

        <button class="toolbar-icon-button format-action" onclick="changeIndent(-1)" aria-label="减少缩进" title="减少缩进（Shift + Tab）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 18h16M10 10h10M10 14h10M7 10l-3 2 3 2z"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="changeIndent(1)" aria-label="增加缩进" title="增加缩进（Tab）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 18h16M10 10h10M10 14h10M4 10l3 2-3 2z"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="applyTextAlignment('left')" aria-label="左对齐" title="左对齐（Ctrl + Shift + L）">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 10h11M4 14h16M4 18h9"></path>
          </svg>
        </button>
        <button class="toolbar-icon-button format-action" onclick="applyTextAlignment('center')" aria-label="居中" title="居中（Ctrl + Shift + E）">

## 字内公式

字内公式写在一对美元符号中间。例如，质能方程 $E=mc^2$ 会显示在正文内部。

函数 $f(x)=ax^2+bx+c$ 的判别式为 $\Delta=b^2-4ac$。

## 行间公式

较长的公式可以单独写在两对美元符号之间。点击编辑工具栏中的 ∑ 图标会插入普通公式；点击它旁边的小箭头，可以选择无编号公式或自定义编号公式。点击 № 图标，可以选择“不显示”、“以章节编号 x.x”或“以顺序编号”。按章节编号时：如果文档中存在第二个及后续一级标题，就按这些正文一级标题分章；如果只有文档标题这一个一级标题，则继续按二级标题分章，例如 1.1、1.2、2.1：

$$
x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}
$$

这个公式明确设为不编号：

$$
\int_{-\infty}^{+\infty} e^{-x^2}dx=\sqrt{\pi}
$$ &lt;!-- eq:no-number --&gt;

选择“自定义编号公式”后，可以直接填写 `3.5`、`A-2` 或 `附录1`，不需要记忆或手动输入编号代码。

## 图片插入、调整与旋转

图片可以通过三种方式插入：

1. 点击第二行编辑工具栏中的图片图标，从电脑选择一张或多张图片。
2. 直接把电脑里的图片文件拖到左侧源码区。
3. 复制图片或截图后，在左侧源码区按 `Ctrl + V` 粘贴。

插入后，左侧会生成类似下面的代码：

```markdown
![图片名称][image-abc123]{width=100% height=auto rotate=0}
```

其中：

- `width=100%` 表示图片默认适应正文宽度，不会撑破右侧预览、导出的 HTML 或 PDF 页面。
- `height=auto` 表示保持图片原来的长宽比例。
- `rotate=0` 表示默认不旋转。

可以直接修改图片大小和旋转角度，例如：

```markdown
![图片名称][image-abc123]{width=60% height=auto rotate=0}
![图片名称][image-abc123]{width=420px height=auto rotate=90}
![图片名称][image-abc123]{width=12cm height=8cm rotate=180}
![图片名称][image-abc123]{width=70% height=auto rotate=360}
```

`rotate` 可以填写 `0` 到 `360` 之间的任意数字。旋转后，编辑器会重新计算图片的实际占用范围，并在必要时自动缩小，避免超出页面。

通常只需要修改 `width` 和 `rotate`，并保留 `height=auto`。尺寸支持 `%`、`px`、`cm`、`mm`、`in`、`pt`、`em`、`rem`、`vw`、`vh` 等常见单位。

图片数据会以引用定义的形式写入源码，例如：

```markdown
[image-abc123]: data:image/png;base64,...
```

因此，通过按钮、拖放或粘贴插入的图片不依赖原始图片文件的位置，右侧预览、导出的渲染版 HTML 和打印 PDF 都能保留图片。

## 右侧可视化编辑

点击顶部的“右侧编辑：关”，可以切换为“右侧编辑：开”。开启后，右侧普通文字、标题、列表、引用、代码块和表格可以直接修改；选中文字后，文本编辑工具栏中的加粗、斜体、下划线、字号、颜色、列表和对齐等功能会作用于右侧，并把结果同步写回左侧 Markdown 源码。

为了避免破坏公式、图片引用和复杂标记，公式与图片不会直接修改渲染后的图形。双击右侧公式会打开 LaTeX 与编号设置；双击右侧图片会打开宽度、高度和旋转设置。含有行内公式、混合图片或复杂 HTML 的段落会打开单段源码编辑框，只替换对应段落，不会把整篇文档重新转换。

右侧写回前会检查左侧对应源码是否仍然一致；如果左侧已经被修改，编辑器会取消本次覆盖并重新渲染，以避免旧的右侧内容覆盖新的左侧源码。

## 草稿、撤销与版本保护

输入后已经停顿超过 700 毫秒，编辑器会自动把当前内容保存为浏览器草稿。刷新页面或重新打开本文件时，会自动恢复最近编辑的草稿，避免因为误刷新或关闭页面而丢失内容。

修改刚才的错误，点击“撤销”或 `Ctrl + Z`。反撤销为 `Ctrl + Shift + Z`。

内容达到一个稳定状态时，可以点击“保存”作为固定备份，把当前正文、作者、时间和公式设置保存成一个不会被后续自动草稿覆盖的稳定版本。

后续即使把内容改乱，并且已经刷新页面，也可以点击“恢复版本”，回到最近一次手动保存的稳定版本。恢复前编辑器会要求确认，避免误覆盖当前草稿。

把编辑器复制或另存为不同文件名、放到不同文件夹后，会被视为一个新的独立项目，不会自动显示其他项目的草稿或保存版本。

“清空”可以随时删除当前项目的自动草稿和保存版本，并恢复为这个 HTML 文件内置的示例正文。

点击“写入源码”，会下载一份新的、仍然可以继续编辑的 HTML。当前正文、内嵌图片、作者、时间和公式编号设置会直接成为新文件内部的初始内容。

更换浏览器、清理浏览器数据或更换设备后，自动草稿和手动保存版本可能无法恢复。重要文档仍建议定期使用“写入源码”，或导出到电脑。

      return {

    function updateMetadataCompactSummary(

    function buildMetadataTextHTML(metadata, includeLabels = true) {

    function getEquationNumberingSettings() {
      return {
        enabled: equationNumberingCheckbox.checked,

    function getEquationNumberingMode() {
      if (!equationNumberingCheckbox.checked) {

        ? "chapter"
        : "sequence";
    }

    function updateEquationNumberingButton() {
      if (!equationNumberingButton || !equationNumberingBadge) return;

      const mode = getEquationNumberingMode();
      const labels = {
        none: {
          badge: "×",

        },

        },

        }

    function setEquationNumberingMode(mode) {
      if (!["none", "chapter", "sequence"].includes(mode)) {
        return;
      }

      equationNumberingCheckbox.checked = mode !== "none";
      defaultNumberedEquationCheckbox.checked = mode !== "sequence";

      updateEquationNumberingButton();
      scheduleRender();
      scheduleDraftSave();

      const statusLabels = {
        none: "公式编号已关闭",
        chapter: "公式按章节编号",
