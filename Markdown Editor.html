    function insertTextAtEditorCursor(text, cursorOffset) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const nextCursor = start + cursorOffset;

      replaceEditorTextRange(
        start,
        end,
        text,
        nextCursor,
        nextCursor
      );
    }

    function insertEquationTemplate(mode = "plain", customLabel = "") {
      prepareSourceInsertionFromPreview();
      let normalizedMode = mode;
      if (mode === true) normalizedMode = "number";
      if (mode === false) normalizedMode = "no-number";
      let marker = "";
      if (normalizedMode === "number") marker = " <!-- eq:number -->";
      if (normalizedMode === "no-number") marker = " <!-- eq:no-number -->";
      if (normalizedMode === "custom") {
        const label = sanitizeCustomEquationLabel(customLabel);
        if (!label) return;
        marker = ` <!-- eq:label=${label} -->`;
      }
      const { start, end } = getFormattingSelection();
      const prefix = start > 0 && editor.value[start - 1] !== "\n" ? "\n\n" : "";
      const template = `${prefix}$$\n\n$$${marker}\n`;
      const cursor = start + prefix.length + 3;
      replaceEditorTextRange(start, end, template, cursor, cursor);
      const labels = {
        plain: "已插入普通公式",
        "no-number": "已插入无编号公式",
        number: "已插入强制编号公式",
        custom: "已插入自定义编号公式"
      };
      setStatus(labels[normalizedMode] || "已插入公式");
    }

    function insertCustomNumberedEquation() {
      const input = window.prompt(
        "请输入公式编号或标签，例如：3.5、A-2、附录1。\n不需要输入括号，也不需要记任何代码。",
        "3.5"
      );
      if (input === null) return;
      const label = sanitizeCustomEquationLabel(input);
      if (!label) {
        alert("没有检测到可用的编号。\n请填写数字、文字、句点或连字符。");
        return;
      }
      insertEquationTemplate("custom", label);
    }

    function getScrollRatio(element) {
      const maxScroll = element.scrollHeight - element.clientHeight;
      return maxScroll > 0 ? element.scrollTop / maxScroll : 0;
    }

    function setScrollRatio(element, ratio) {
      const maxScroll = Math.max(0, element.scrollHeight - element.clientHeight);
      element.scrollTop = Math.max(0, Math.min(1, ratio)) * maxScroll;
    }

    function getLineStarts(text) {
      const starts = [0];

      for (let index = 0; index < text.length; index += 1) {
        if (text[index] === "\n") starts.push(index + 1);
      }

      return starts;
    }

    function lineFromCharacterIndex(lineStarts, characterIndex) {
      let low = 0;
      let high = lineStarts.length - 1;

      while (low <= high) {
        const middle = Math.floor((low + high) / 2);

        if (lineStarts[middle] <= characterIndex) {
          low = middle + 1;
        } else {
          high = middle - 1;
        }
      }

      return Math.max(0, high);
    }

    function normalizeImageDimension(value, fallback) {
      const normalized = String(value || "")
        .trim()
        .toLowerCase();

      if (!normalized) return fallback;
      if (normalized === "auto") return "auto";

      /*
       * 允许常用的安全尺寸单位。数值为 0 时也合法。
       * 不允许 calc()、变量、分号等任意 CSS 内容。
       */
      if (
        /^(?:0|(?:\d+(?:\.\d+)?|\.\d+)(?:%|px|pt|pc|cm|mm|in|em|rem|vw|vh|vmin|vmax))$/
          .test(normalized)
      ) {
        return normalized;
      }

      return fallback;
    }

    function normalizeImageRotation(value) {
      const rotation = Number.parseFloat(
        String(value ?? "").trim()
      );

      if (!Number.isFinite(rotation)) {
        return 0;
      }

      return Math.min(360, Math.max(0, rotation));
    }

    function parseImageSizingAttributes(attributeText) {
      const text = String(attributeText || "");
      const widthMatch =
        text.match(/(?:^|\s)width\s*=\s*([^\s}]+)/i);
      const heightMatch =
        text.match(/(?:^|\s)height\s*=\s*([^\s}]+)/i);
      const rotateMatch =
        text.match(/(?:^|\s)rotate\s*=\s*([^\s}]+)/i);

      return {
        width: normalizeImageDimension(
          widthMatch ? widthMatch[1] : "",
          "100%"
        ),
        height: normalizeImageDimension(
          heightMatch ? heightMatch[1] : "",
          "auto"
        ),
        rotate: normalizeImageRotation(
          rotateMatch ? rotateMatch[1] : "0"
        )
      };
    }

    function extractImageSizingSpecs(source) {
      const specs = [];
      const imagePattern =
        /!\[[^\]\n]*\](?:\([^)\n]+\)|\[[^\]\n]*\])(?:\s*\{([^{}\n]*)\})?/g;

      let match;

      while ((match = imagePattern.exec(String(source || "")))) {
        specs.push(parseImageSizingAttributes(match[1] || ""));
      }

      return specs;
    }

    function stripImageSizingSyntax(source) {
      return String(source || "").replace(
        /(!\[[^\]\n]*\](?:\([^)\n]+\)|\[[^\]\n]*\]))\s*\{[^{}\n]*\}/g,
        "$1"
      );
    }

    function fitRotatedImage(image) {
      const frame = image.closest(".image-transform-frame");

      if (!frame) return;

      const rotation =
        normalizeImageRotation(frame.dataset.rotate || "0");
      const width = image.offsetWidth;
      const height = image.offsetHeight;
      const availableWidth =
        frame.clientWidth ||
        frame.parentElement?.clientWidth ||
        0;

      if (
        width <= 0 ||
        height <= 0 ||
        availableWidth <= 0
      ) {
        return;
      }

      const radians = rotation * Math.PI / 180;
      const absoluteCosine = Math.abs(Math.cos(radians));
      const absoluteSine = Math.abs(Math.sin(radians));
      const rotatedWidth =
        width * absoluteCosine + height * absoluteSine;
      const rotatedHeight =
        width * absoluteSine + height * absoluteCosine;
      const scale =
        rotatedWidth > availableWidth
          ? availableWidth / rotatedWidth
          : 1;

      image.style.transform =
        "rotate(" + rotation + "deg) scale(" + scale + ")";
      frame.style.height =
        Math.max(1, Math.ceil(rotatedHeight * scale)) + "px";
    }

    function fitAllRotatedImages(container = document) {
      const images = Array.from(
        container.querySelectorAll(
          ".image-transform-frame img"
        )
      );

      images.forEach(image => {
        fitRotatedImage(image);
      });
    }

    function applyImageSizingToContainer(container, source) {
      const images = Array.from(container.querySelectorAll("img"));
      const specs = extractImageSizingSpecs(source);

      images.forEach((image, index) => {
        const spec = specs[index] || {
          width: "100%",
          height: "auto",
          rotate: 0
        };
        let frame = image.closest(".image-transform-frame");

        if (!frame) {
          frame = document.createElement("span");
          frame.className = "image-transform-frame";
          image.replaceWith(frame);
          frame.appendChild(image);
        }

        frame.dataset.rotate = String(spec.rotate);
        frame.style.display = "flex";
        frame.style.width = "100%";
        frame.style.maxWidth = "100%";
        frame.style.alignItems = "center";
        frame.style.justifyContent = "center";
        frame.style.margin = "0.9em auto";
        frame.style.overflow = "visible";
        frame.style.breakInside = "avoid";
        frame.style.pageBreakInside = "avoid";

        image.style.width = spec.width;
        image.style.maxWidth = "100%";
        image.style.height = spec.height;
        image.style.objectFit = "contain";
        image.style.display = "block";
        image.style.margin = "0";
        image.style.transformOrigin = "center center";
        image.style.breakInside = "avoid";
        image.style.pageBreakInside = "avoid";
        image.loading = "eager";
        image.decoding = "async";

        const refit = () => {
          requestAnimationFrame(() => {
            fitRotatedImage(image);
          });
        };

        if (!image.complete) {
          image.addEventListener("load", refit, {
            once: true
          });
        }

        refit();
      });
    }

    function renderMarkdownWithAnchors(
      source,
      mappingSource = source
    ) {
      const tokens = marked.lexer(source);
      const lineStarts = getLineStarts(mappingSource);
      const sourceBlocks =
        getRenderableSourceBlocks(mappingSource);
      const parts = [];
      let sourceBlockIndex = 0;

      previewBlockMap = sourceBlocks.map(block => ({
        ...block
      }));

      tokens.forEach(token => {
        if (token.type === "space") return;

        const tokenList = [token];
        tokenList.links = tokens.links || {};

        const renderedToken = marked.parser(tokenList);

        if (
          !renderedToken
            .replace(/<!--[\s\S]*?-->/g, "")
            .trim()
        ) {
          return;
        }

        const matched = findMatchingSourceBlock(
          token,
          previewBlockMap,
          sourceBlockIndex
        );
        const block = matched.block;
        sourceBlockIndex = matched.nextIndex;

        if (!block) {
          parts.push(renderedToken);
          return;
        }

        const template = document.createElement("template");
        template.innerHTML = renderedToken;

        Array.from(template.content.children)
          .forEach(element => {
            setPreviewBlockAttributes(element, block);
          });

        parts.push(
          `<span class="sync-anchor" ` +
          `data-source-line="${block.sourceLine}" ` +
          `aria-hidden="true"></span>` +
          template.innerHTML
        );
      });

      parts.push(
        `<span class="sync-anchor" ` +
        `data-source-line="${lineStarts.length}" ` +
        `aria-hidden="true"></span>`
      );

      return parts.join("\n");
    }

    function buildTocLinksHTML(entries, className = "toc-link") {
      if (!entries.length) {
        return '<div class="toc-empty">尚未检测到可加入目录的正文标题。</div>';
      }

      return entries.map(entry => (
        `<a class="${className} toc-level-${entry.level}" ` +
        `href="#${entry.id}" data-target-id="${entry.id}" ` +
        `data-source-line="${entry.sourceLine}">` +
        `${escapeHTML(entry.text)}</a>`
      )).join("");
    }

    function buildPrintFrontMatterHTML(entries, metadata) {
      const items = entries.map(entry => (
        `<li class="print-toc-item toc-level-${entry.level}">` +
        `<a href="#${entry.id}">${escapeHTML(entry.text)}</a>` +
        `</li>`
      )).join("");

      const authorHTML = metadata.author
        ? `<div>作者：${escapeHTML(metadata.author)}</div>`
        : "";
      const dateHTML = metadata.date
        ? `<div>时间：${escapeHTML(metadata.date)}</div>`
        : "";
      const tocHTML = items
        ? `<div class="print-toc-title">目录</div>` +
          `<ol class="print-toc-list">${items}</ol>`
        : `<div class="print-toc-title">目录</div>` +
          `<div class="toc-empty">尚未检测到可加入目录的正文标题。</div>`;

      return (
        `<section class="print-front-matter" aria-label="标题页与目录">` +
        `<h1 class="print-cover-title">${escapeHTML(metadata.title)}</h1>` +
        `<div class="print-cover-meta">${authorHTML}${dateHTML}</div>` +
        `${tocHTML}` +
        `</section>`
      );
    }

    function findHeadingSourceLine(heading) {
      let node = heading.previousElementSibling;
      while (node && !node.classList.contains("sync-anchor")) {
        node = node.previousElementSibling;
      }
      return node ? Number(node.dataset.sourceLine) || 0 : 0;
    }

    function createPreviewToc(metadata) {
      const headings = Array.from(
        preview.querySelectorAll(
          ":scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6"
        )
      );

      const firstH1 = headings.find(
        heading => heading.tagName.toLowerCase() === "h1"
      );

      if (firstH1) {
        firstH1.classList.add("document-title");
      }

      tocDocumentTitle.textContent = metadata.title;
      tocDocumentMeta.innerHTML = buildMetadataTextHTML(metadata, true);

      /*
       * 第一个 H1 是文档标题，不重复放入目录。
       * 后续 H1 以及全部 H2-H6 都是正文目录项。
       */
      const tocHeadings = headings.filter(heading => {
        const level = Number(heading.tagName.slice(1));

        if (level === 1) {
          return heading !== firstH1;
        }

        return level >= 2 && level <= 6;
      });

      tocEntries = tocHeadings.map((heading, index) => {
        const level = Number(heading.tagName.slice(1));
        const id = `md-heading-${index + 1}`;
        const sourceLine = findHeadingSourceLine(heading);
        const text = heading.textContent.trim() || `未命名标题 ${index + 1}`;
        heading.id = id;
        heading.dataset.sourceLine = String(sourceLine);
        return { id, level, sourceLine, text, element: heading, y: 0 };
      });

      tocList.innerHTML = buildTocLinksHTML(tocEntries);
      preview.insertAdjacentHTML(
        "afterbegin",
        buildPrintFrontMatterHTML(tocEntries, metadata)
      );
    }

    function refreshTocPositions() {
      const wrapRect = previewWrap.getBoundingClientRect();
      tocEntries.forEach(entry => {
        const rect = entry.element.getBoundingClientRect();
        entry.y = rect.top - wrapRect.top + previewWrap.scrollTop;
      });
    }

    function updateActiveToc() {
      if (!tocEntries.length) return;
      const focusY = previewWrap.scrollTop + 54;
      let activeEntry = tocEntries[0];
      tocEntries.forEach(entry => {
        if (entry.y <= focusY) activeEntry = entry;
      });
      tocList.querySelectorAll(".toc-link").forEach(link => {
        link.classList.toggle("active", link.dataset.targetId === activeEntry.id);
      });
    }

    function jumpToTocEntry(entry) {
      if (!entry || !entry.element) return;
      const wrapRect = previewWrap.getBoundingClientRect();
      const headingRect = entry.element.getBoundingClientRect();
      const targetTop = headingRect.top - wrapRect.top + previewWrap.scrollTop - 18;
      const maxScroll = Math.max(0, previewWrap.scrollHeight - previewWrap.clientHeight);
      scrollSyncLock = true;
      setEditorFocusLine(entry.sourceLine);
      previewWrap.scrollTo({
        top: Math.max(0, Math.min(maxScroll, targetTop)),
        behavior: "smooth"
      });
      setTimeout(() => {
        scrollSyncLock = false;
        updateActiveToc();
      }, 420);
    }

    function buildStandaloneDocumentData(source, metadata) {
      const container = document.createElement("div");
      const numberedSource = applyEquationNumbering(source);
      const renderedSource = stripImageSizingSyntax(numberedSource);
      container.innerHTML = marked.parse(renderedSource);
      applyImageSizingToContainer(container, source);
      const headings = Array.from(
        container.querySelectorAll("h1, h2, h3, h4, h5, h6")
      );
      const firstH1 = headings.find(
        heading => heading.tagName.toLowerCase() === "h1"
      );
      let sectionIndex = 0;

      headings.forEach(heading => {
        const level = Number(heading.tagName.slice(1));
        const isDocumentTitle =
          level === 1 && heading === firstH1;

        if (isDocumentTitle) {
          heading.classList.add("document-title");
          return;
        }

        if (level >= 1 && level <= 6) {
          sectionIndex += 1;
          heading.id = `section-${sectionIndex}`;
          heading.classList.add("document-heading");
        }
      });

      const entries = headings
        .filter(heading => {
          const level = Number(heading.tagName.slice(1));

          if (level === 1) {
            return heading !== firstH1;
          }

          return level >= 2 && level <= 6;
        })
        .map((heading, index) => ({
          id: heading.id,
          level: Number(heading.tagName.slice(1)),
          sourceLine: 0,
          text: heading.textContent.trim() || `未命名标题 ${index + 1}`
        }));

      insertDocumentByline(container, metadata);
      container.insertAdjacentHTML(
        "afterbegin",
        buildPrintFrontMatterHTML(entries, metadata)
      );

      return {
        bodyHTML: container.innerHTML,
        tocHTML: buildTocLinksHTML(entries, "export-toc-link"),
        title: metadata.title,
        metaHTML: buildMetadataTextHTML(metadata, true)
      };
    }

    function refreshSyncAnchors() {
      const wrapRect = previewWrap.getBoundingClientRect();
      let previousY = 0;

      syncAnchors = Array.from(
        preview.querySelectorAll(".sync-anchor")
      ).map(anchor => {
        const rect = anchor.getBoundingClientRect();
        const measuredY = rect.top - wrapRect.top + previewWrap.scrollTop;
        const y = Math.max(previousY, measuredY);
        previousY = y;

        return {
          line: Number(anchor.dataset.sourceLine) || 0,
          y
        };
      });

      /*
       * 若相邻锚点落在同一源码行，只保留位置更早的一个；
       * 这样插值区间不会出现除以零。
       */
      syncAnchors = syncAnchors.filter((anchor, index, array) => {
        return index === 0 || anchor.line !== array[index - 1].line;
      });
    }

    function getEditorMetrics() {
      const style = getComputedStyle(editor);
      const lineHeight =
        Number.parseFloat(style.lineHeight) ||
        Number.parseFloat(style.fontSize) * 1.68;

      return {
        lineHeight,
        paddingTop: Number.parseFloat(style.paddingTop) || 0
      };
    }

    function getEditorFocusLine() {
      const metrics = getEditorMetrics();
      const focusY =
        editor.scrollTop +
        editor.clientHeight * syncViewportRatio -
        metrics.paddingTop;

      return Math.max(0, focusY / metrics.lineHeight);
    }

    function setEditorFocusLine(line) {
      const metrics = getEditorMetrics();
      const target =
        line * metrics.lineHeight +
        metrics.paddingTop -
        editor.clientHeight * syncViewportRatio;

      const maxScroll = Math.max(0, editor.scrollHeight - editor.clientHeight);
      editor.scrollTop = Math.max(0, Math.min(maxScroll, target));
    }

    function sourceLineToPreviewY(line) {
      if (!syncAnchors.length) return 0;
      if (line <= syncAnchors[0].line) return syncAnchors[0].y;

      for (let index = 0; index < syncAnchors.length - 1; index += 1) {
        const current = syncAnchors[index];
        const next = syncAnchors[index + 1];

        if (line <= next.line) {
          const lineSpan = Math.max(1, next.line - current.line);
          const progress = Math.max(
            0,
            Math.min(1, (line - current.line) / lineSpan)
          );

          return current.y + progress * (next.y - current.y);
        }
      }

      return syncAnchors[syncAnchors.length - 1].y;
    }

    function previewYToSourceLine(y) {
      if (!syncAnchors.length) return 0;
      if (y <= syncAnchors[0].y) return syncAnchors[0].line;

      for (let index = 0; index < syncAnchors.length - 1; index += 1) {
        const current = syncAnchors[index];
        const next = syncAnchors[index + 1];

        if (y <= next.y) {
          const heightSpan = Math.max(1, next.y - current.y);
          const progress = Math.max(
            0,
            Math.min(1, (y - current.y) / heightSpan)
          );

          return current.line + progress * (next.line - current.line);
        }
      }

      return syncAnchors[syncAnchors.length - 1].line;
    }

    function runWithScrollLock(callback) {
      if (scrollSyncLock) return;

      scrollSyncLock = true;
      callback();

      requestAnimationFrame(() => {
        scrollSyncLock = false;
      });
    }

    function syncEditorToPreview() {
      if (!syncScrollEnabled || scrollSyncLock || !syncAnchors.length) return;

      runWithScrollLock(() => {
        const editorMaxScroll = Math.max(
          0,
          editor.scrollHeight - editor.clientHeight
        );
        const previewMaxScroll = Math.max(
          0,
          previewWrap.scrollHeight - previewWrap.clientHeight
        );

        /*
         * 顶部和底部采用硬对齐，避免内容锚点插值在边界处
         * 留下少量偏移。中间区域仍然按照对应内容同步。
         */
        if (editor.scrollTop <= 2) {
          previewWrap.scrollTop = 0;
          return;
        }

        if (
          editorMaxScroll > 0 &&
          editor.scrollTop >= editorMaxScroll - 2
        ) {
          previewWrap.scrollTop = previewMaxScroll;
          return;
        }

        const sourceLine = getEditorFocusLine();
        const targetContentY = sourceLineToPreviewY(sourceLine);
        const targetScrollTop =
          targetContentY - previewWrap.clientHeight * syncViewportRatio;

        previewWrap.scrollTop = Math.max(
          0,
          Math.min(previewMaxScroll, targetScrollTop)
        );
      });
    }

    function syncPreviewToEditor() {
      if (!syncScrollEnabled || scrollSyncLock || !syncAnchors.length) return;

      runWithScrollLock(() => {
        const previewMaxScroll = Math.max(
          0,
          previewWrap.scrollHeight - previewWrap.clientHeight
        );
        const editorMaxScroll = Math.max(
          0,
          editor.scrollHeight - editor.clientHeight
        );

        if (previewWrap.scrollTop <= 2) {
          editor.scrollTop = 0;
          metadataForcedOpen = false;
          updateMetadataBarCollapse();
          return;
        }

        if (
          previewMaxScroll > 0 &&
          previewWrap.scrollTop >= previewMaxScroll - 2
        ) {
          editor.scrollTop = editorMaxScroll;
          return;
        }

        const previewFocusY =
          previewWrap.scrollTop +
          previewWrap.clientHeight * syncViewportRatio;

        setEditorFocusLine(previewYToSourceLine(previewFocusY));
      });
    }

    function toggleSyncScroll() {
      syncScrollEnabled = !syncScrollEnabled;
      syncScrollButton.textContent =
        "同步滚动：" + (syncScrollEnabled ? "开" : "关");

      if (syncScrollEnabled) {
        refreshSyncAnchors();
        syncEditorToPreview();
        setStatus("已开启同步滚动");
      } else {
        setStatus("已关闭同步滚动");
      }
    }

    async function renderNow() {
      const mySequence = ++renderSequence;
      const sourceFocusLine = getEditorFocusLine();
      const previewRatio = getScrollRatio(previewWrap);

      setStatus("正在渲染…");

      try {
        const metadata = getDocumentMetadata(true);
        updateMetadataCompactSummary(metadata);
        const numberedSource =
          applyEquationNumbering(editor.value);
        const renderedSource =
          stripImageSizingSyntax(numberedSource);

        preview.innerHTML =
          renderMarkdownWithAnchors(
            renderedSource,
            editor.value
          );
        applyImageSizingToContainer(preview, editor.value);
        insertDocumentByline(preview, metadata);
        createPreviewToc(metadata);

        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetClear([preview]);
          await MathJax.typesetPromise([preview]);
        }

        applyRightEditingState();
        refreshSyncAnchors();
        refreshTocPositions();
        updateActiveToc();

        scrollSyncLock = true;

        if (syncScrollEnabled) {
          const targetContentY = sourceLineToPreviewY(sourceFocusLine);
          const targetScrollTop =
            targetContentY - previewWrap.clientHeight * syncViewportRatio;
          const maxScroll = Math.max(
            0,
            previewWrap.scrollHeight - previewWrap.clientHeight
          );

          previewWrap.scrollTop = Math.max(
            0,
            Math.min(maxScroll, targetScrollTop)
          );
        } else {
          setScrollRatio(previewWrap, previewRatio);
        }

        requestAnimationFrame(() => {
          scrollSyncLock = false;
        });

        if (mySequence === renderSequence) {
          const now = new Date();
          setStatus(
            "已渲染 " +
            now.toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            })
          );
        }
      } catch (error) {
        console.error(error);
        setStatus("渲染失败，请检查公式");
      }
    }

    function toggleRealtimeRender() {
      realtimeRenderEnabled = !realtimeRenderEnabled;
      realtimeButton.textContent =
        "实时渲染：" + (realtimeRenderEnabled ? "开" : "关");

      if (realtimeRenderEnabled) {
        setStatus("已恢复实时渲染");
        renderNow();
      } else {
        clearTimeout(renderTimer);
        setStatus("实时渲染已暂停");
      }
    }

    function scheduleRender() {
      clearTimeout(renderTimer);

      if (!realtimeRenderEnabled) {
        setStatus("内容已修改，实时渲染已暂停");
        return;
      }

      setStatus("等待输入结束…");
      renderTimer = setTimeout(renderNow, 260);
    }


    function collectDocumentState() {
      return {
        source: editor.value,
        author: authorInput.value,
        date: dateInput.value,
        automaticDate: autoDateCheckbox.checked,
        equationNumberingEnabled: equationNumberingCheckbox.checked,
        chapterEquationNumbering:
          defaultNumberedEquationCheckbox.checked,
        formattingToolbarOpen,
        formattingToolbarPinned,
        rightEditingEnabled,
        updatedAt: new Date().toISOString()
      };
    }

    function parseStoredState(rawValue) {
      if (!rawValue) return null;

      try {
        const parsed = JSON.parse(rawValue);

        if (!parsed || typeof parsed !== "object") {
          return null;
        }

        return parsed;
      } catch (error) {
        console.error("无法解析保存状态：", error);
        return null;
      }
    }

    function migrateStoredSource(source) {
      return String(source || "")
        .replace(
          /(?:\n\s*)?不过，图片越多、分辨率越高，Markdown 文件也会越大。/g,
          ""
        )
        .replace(/\n{3,}/g, "\n\n");
    }

    function applyDocumentState(state, shouldRender = true) {
      if (!state) return false;

      applyingStoredState = true;

      try {
        if (typeof state.source === "string") {
          editor.value = migrateStoredSource(state.source);
        }

        authorInput.value =
          typeof state.author === "string" ? state.author : "";
        dateInput.value =
          typeof state.date === "string" ? state.date : "";
        autoDateCheckbox.checked =
          state.automaticDate !== false;
        equationNumberingCheckbox.checked =
          state.equationNumberingEnabled !== false;

        if ("chapterEquationNumbering" in state) {
          defaultNumberedEquationCheckbox.checked =
            state.chapterEquationNumbering !== false;
        } else {
          defaultNumberedEquationCheckbox.checked =
            state.defaultNumberedEquations !== false;
        }

        formattingToolbarPinned = state.formattingToolbarPinned === true;
        formattingToolbarOpen =
          formattingToolbarPinned ||
          state.formattingToolbarOpen === true;
        rightEditingEnabled =
          state.rightEditingEnabled === true;
        rightEditUndoStack = [];
        rightEditRedoStack = [];
        lastEditOrigin = "source";
        updateMetadataCompactSummary();
        updateEquationNumberingButton();
        metadataForcedOpen = false;
        updateFormattingToolbarState();
        editor.scrollTop = 0;
        updateMetadataBarCollapse();

        if (shouldRender) {
          renderNow();
        }

        return true;
      } finally {
        applyingStoredState = false;
      }
    }

    function saveDraftNow(showSuccessStatus = false) {
      if (applyingStoredState) return false;

      try {
        localStorage.setItem(
          draftStorageKey,
          JSON.stringify(collectDocumentState())
        );

        if (showSuccessStatus) {
          setStatus("草稿已自动保存");
        }

        return true;
      } catch (error) {
        console.error(error);
        setStatus("草稿过大，请下载 .md 或导出 HTML");
        return false;
      }
    }

    function scheduleDraftSave() {
      if (applyingStoredState) return;

      clearTimeout(draftSaveTimer);
      draftSaveTimer = setTimeout(() => {
        saveDraftNow(true);
      }, 700);
    }

    function restoreDraftOnStartup() {
      const draftState = parseStoredState(
        localStorage.getItem(draftStorageKey)
      );

      if (!draftState) {
        return false;
      }

      applyDocumentState(draftState, false);
      saveDraftNow(false);
      return true;
    }

    function saveVersion() {
      const state = collectDocumentState();
      state.savedAt = new Date().toISOString();

      try {
        localStorage.setItem(
          versionStorageKey,
          JSON.stringify(state)
        );

        saveDraftNow(false);
        setStatus("稳定版本已保存");
        alert(
          "当前内容已保存为稳定版本。\n" +
          "自动草稿之后继续变化，也不会覆盖这个版本。"
        );
      } catch (error) {
        console.error(error);
        setStatus("保存版本失败");
        alert(
          "保存版本失败。文档或内嵌图片可能超过浏览器存储容量，" +
          "请下载 .md 或导出 HTML 备份。"
        );
      }
    }

    function restoreSavedVersion() {
      const savedState = parseStoredState(
        localStorage.getItem(versionStorageKey)
      );

      if (!savedState) {
        alert(
          "当前浏览器中还没有手动保存的稳定版本。\n" +
          "请先点击“保存”。"
        );
        return;
      }

      const confirmed = window.confirm(
        "恢复已保存版本会覆盖当前自动草稿。\n" +
        "确定要继续吗？"
      );

      if (!confirmed) return;

      applyDocumentState(savedState, true);
      saveDraftNow(false);
      setStatus("已恢复稳定版本");
      alert("已经恢复到最近一次手动保存的稳定版本。");
    }

    function clearCurrentProjectData() {
      const confirmed = window.confirm(
        "这会删除当前 HTML 项目的自动草稿和已保存版本，" +
        "并恢复为本文件内置的示例正文。\n" +
        "其他 HTML 项目不会受到影响。确定继续吗？"
      );

      if (!confirmed) return;

      try {
        localStorage.removeItem(draftStorageKey);
        localStorage.removeItem(versionStorageKey);

        applyingStoredState = true;

        editor.value = initialTemplateSource;
        authorInput.value = "";
        dateInput.value = "";
        autoDateCheckbox.checked = true;
        equationNumberingCheckbox.checked = true;
        defaultNumberedEquationCheckbox.checked = true;
        updateEquationNumberingButton();
        formattingToolbarPinned = false;
        formattingToolbarOpen = false;
        rightEditingEnabled = false;
        rightEditUndoStack = [];
        rightEditRedoStack = [];
        lastEditOrigin = "source";
        metadataForcedOpen = false;
        setRightEditButtonState();
        updateFormattingToolbarState();
        editor.scrollTop = 0;
        editor.scrollLeft = 0;

        updateMetadataCompactSummary();
        updateMetadataBarCollapse();
        renderNow();

        setStatus("当前项目数据已清空");
        alert(
          "当前项目的自动草稿和保存版本已经清除。\n" +
          "本页面已恢复为内置示例正文。"

      } catch (error) {
        console.error(error);
        setStatus("清空项目数据失败");

      } finally {
        applyingStoredState = false;
      }
    }

    function runEditorHistoryCommand(command) {
      editor.focus();

      try {
        document.execCommand(command);
      } catch (error) {
        console.error(error);
      }

      setTimeout(() => {
        scheduleRender();
        scheduleDraftSave();
      }, 0);
    }

    function undoEdit() {
      if (
        lastEditOrigin === "preview" &&
        undoRightEdit()
      ) {
        return;
      }

      runEditorHistoryCommand("undo");
    }

    function redoEdit() {
      if (
        lastEditOrigin === "preview" &&
        redoRightEdit()
      ) {
        return;
      }

      runEditorHistoryCommand("redo");
    }

    function openImagePicker() {
      prepareSourceInsertionFromPreview();
      imageFileInput.value = "";
      imageFileInput.click();
    }

    function sanitizeImageAlt(filename) {
      const withoutExtension = String(filename || "图片")
        .replace(/\.[^.]+$/, "")
        .trim();

      return (withoutExtension || "图片")
        .replace(/[\[\]\r\n]/g, " ")
        .replace(/\s+/g, " ");
    }

    function readImageFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.addEventListener("load", () => {
          resolve(String(reader.result || ""));
        });

        reader.addEventListener("error", () => {
          reject(reader.error || new Error("图片读取失败"));
        });

        reader.readAsDataURL(file);
      });
    }

    function createImageReferenceId(index = 0) {
      const timePart = Date.now().toString(36);
      const randomPart = Math.random().toString(36).slice(2, 8);
      let referenceId =
        `image-${timePart}-${randomPart}-${index + 1}`;

      while (
        editor.value.includes(`[${referenceId}]`) ||
        editor.value.includes(`[${referenceId}]:`)
      ) {
        referenceId =
          `image-${Date.now().toString(36)}-` +
          `${Math.random().toString(36).slice(2, 9)}-${index + 1}`;
      }

      return referenceId;
    }

    async function insertImageFiles(fileList) {
      const files = Array.from(fileList || []).filter(
        file => file && file.type.startsWith("image/")
      );

      if (!files.length) {
        setStatus("没有检测到图片文件");
        return;
      }

      setStatus(`正在插入 ${files.length} 张图片…`);

      try {
        const imageLines = [];
        const referenceLines = [];

        for (let index = 0; index < files.length; index += 1) {
          const file = files[index];
          const dataURL = await readImageFileAsDataURL(file);
          const alt = sanitizeImageAlt(file.name);
          const referenceId = createImageReferenceId(index);

          /*
           * 正文位置使用简短的引用式 Markdown：
           * ![图片名][image-xxxx]
           *
           * 很长的 Base64 数据放在下面的引用定义中。
           * 这样源码区首先展示的是可读的图片代码，而不是一整行数据。
           */
          imageLines.push(
            `![${alt}][${referenceId}]` +
            `{width=100% height=auto rotate=0}`
          );
          referenceLines.push(`[${referenceId}]: ${dataURL}`);
        }

        const needsLeadingBlankLine =
          editor.selectionStart > 0 &&
          editor.value[editor.selectionStart - 1] !== "\n";
        const prefix = needsLeadingBlankLine ? "\n\n" : "";

        const readableBlock =
          prefix + imageLines.join("\n\n") + "\n\n";
        const referenceBlock =
          referenceLines.join("\n") + "\n";
        const markdown =
          readableBlock + referenceBlock;

        /*
         * 光标放在简短的图片代码之后、长数据定义之前。
         * 同时强制源码区回到横向最左侧，避免看起来像“代码消失”。
         */
        const cursorOffset = readableBlock.length;
        insertTextAtEditorCursor(markdown, cursorOffset);

        editor.scrollLeft = 0;

        requestAnimationFrame(() => {
          editor.scrollLeft = 0;
        });

        setStatus(`已插入 ${files.length} 张图片`);
      } catch (error) {
        console.error(error);
        setStatus("图片插入失败");
        alert("图片读取失败，请换一张图片后重试。");
      }
    }

    function hasDraggedImage(event) {
      const items = Array.from(
        event.dataTransfer?.items || []
      );

      return items.some(
        item =>
          item.kind === "file" &&
          item.type.startsWith("image/")
      );
    }

    function getClipboardImageFiles(event) {
      return Array.from(
        event.clipboardData?.items || []
      )
        .filter(
          item =>
            item.kind === "file" &&
            item.type.startsWith("image/")
        )
        .map(item => item.getAsFile())
        .filter(Boolean);
    }

    function sanitizeProjectFilename(value) {
      const normalized = String(value || "Markdown 项目")
        .replace(/[\\/:*?"<>|]+/g, "_")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 80);

      return normalized || "Markdown 项目";
    }

    function setClonedCheckboxState(root, selector, checked) {
      const element = root.querySelector(selector);

      if (!element) return;

      if (checked) {
        element.setAttribute("checked", "");
      } else {
        element.removeAttribute("checked");
      }
    }

    function writeCurrentProjectIntoSource() {
      try {
        /*
         * 克隆当前编辑器本身，并把运行时状态写回 HTML 属性和
         * textarea 内容。这样生成的是一份仍可继续编辑的完整项目，
         * 而不是只读的渲染页面。
         */
        const clonedRoot = document.documentElement.cloneNode(true);
        const clonedEditor = clonedRoot.querySelector("#editor");
        const clonedAuthor = clonedRoot.querySelector("#authorInput");
        const clonedDate = clonedRoot.querySelector("#dateInput");
        const clonedPreview = clonedRoot.querySelector("#preview");
        const clonedTocList = clonedRoot.querySelector("#tocList");
        const clonedTocTitle =
          clonedRoot.querySelector("#tocDocumentTitle");
        const clonedTocMeta =
          clonedRoot.querySelector("#tocDocumentMeta");
        const clonedStatus = clonedRoot.querySelector("#status");
        const clonedMetadataBar =
          clonedRoot.querySelector("#metadataBar");
        const clonedProjectSeed = clonedRoot.querySelector(
          'meta[name="markdown-editor-project-seed"]'
        );

        if (!clonedEditor || !clonedProjectSeed) {
          throw new Error("无法定位项目源码区域。");
        }

        clonedEditor.textContent = editor.value;
        clonedEditor.classList.remove("image-drop-active");

        if (clonedAuthor) {
          clonedAuthor.setAttribute("value", authorInput.value);
        }

        if (clonedDate) {
          clonedDate.setAttribute("value", dateInput.value);
        }

        setClonedCheckboxState(
          clonedRoot,
          "#autoDateCheckbox",
          autoDateCheckbox.checked
        );
        setClonedCheckboxState(
          clonedRoot,
          "#equationNumberingCheckbox",
          equationNumberingCheckbox.checked
        );
        setClonedCheckboxState(
          clonedRoot,
          "#defaultNumberedEquationCheckbox",
          defaultNumberedEquationCheckbox.checked
        );

        /*
         * 新种子确保下载后的 HTML 是一个独立项目，即使将来
         * 使用相同文件名，也不会继承当前项目的 localStorage。
         */
        const nextSeed =
          `project-${Date.now().toString(36)}-` +
          Math.random().toString(36).slice(2, 10);
        clonedProjectSeed.setAttribute("content", nextSeed);

        /*
         * 不把右侧运行时渲染、目录和 MathJax 缓存写进文件；
         * 新 HTML 打开后会根据已写入的 Markdown 重新生成它们。
         */
        const clonedRightEditButton =
          clonedRoot.querySelector("#rightEditButton");

        if (clonedPreview) {
          clonedPreview.replaceChildren();
          clonedPreview.classList.remove(
            "right-editing-enabled"
          );
        }
        if (clonedRightEditButton) {
          clonedRightEditButton.textContent =
            "右侧编辑：关";
          clonedRightEditButton.setAttribute(
            "aria-pressed",
            "false"
          );
          clonedRightEditButton.classList.remove(
            "is-active"
          );
        }

        clonedRoot
          .querySelectorAll(".right-edit-dialog")
          .forEach(dialog => {
            dialog.removeAttribute("open");
          });

        if (clonedTocList) clonedTocList.replaceChildren();
        if (clonedTocTitle) {
          clonedTocTitle.textContent = "未命名文档";
        }
        if (clonedTocMeta) clonedTocMeta.replaceChildren();
        if (clonedStatus) clonedStatus.textContent = "准备就绪";
        if (clonedMetadataBar) {
          clonedMetadataBar.classList.remove("is-collapsed");
        }

        const clonedFormattingToolbar =
          clonedRoot.querySelector("#formattingToolbarShell");
        const clonedFormattingToggle =
          clonedRoot.querySelector("#formattingToolbarToggle");
        const clonedFormattingPin =
          clonedRoot.querySelector("#formattingToolbarPin");
        if (clonedFormattingToolbar) {
          clonedFormattingToolbar.classList.add("is-collapsed");
          clonedFormattingToolbar.classList.remove("is-pinned");
        }
        if (clonedFormattingToggle) {
          clonedFormattingToggle.setAttribute("aria-expanded", "false");
        }
        if (clonedFormattingPin) {
          clonedFormattingPin.setAttribute("aria-pressed", "false");
        }

        clonedRoot
          .querySelectorAll(
            "#MJX-SVG-global-cache, #MJX-SVG-styles, " +
            "mjx-assistive-mml"
          )
          .forEach(element => element.remove());

        clonedRoot.removeAttribute("style");

        const metadata = getDocumentMetadata(false);
        const clonedTitle = clonedRoot.querySelector("title");

        if (clonedTitle) {
          clonedTitle.textContent =
            `${metadata.title} - Markdown 文档编辑器`;
        }

        const projectHTML =
          "<!DOCTYPE html>\n" + clonedRoot.outerHTML;
        const filename =
          sanitizeProjectFilename(metadata.title) +
          "_可编辑项目.html";

        downloadBlob(
          projectHTML,
          filename,
          "text/html;charset=utf-8"
        );

        setStatus("项目已写入新的 HTML 源码");
        alert(
          "已下载一份新的可编辑 HTML。\n" +
          "当前正文、内嵌图片、作者、时间和公式设置" +
          "已经写入文件内部。"
        );
      } catch (error) {
        console.error(error);
        setStatus("写入项目源码失败");
        alert("将本项目写入源码失败，请重试。");
      }
    }

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 500);
    }

    function downloadMarkdown() {
      downloadBlob(
        editor.value,
        "文档.md",
        "text/markdown;charset=utf-8"
      );
    }

          if (Date.now() - start > timeout) {
            reject(new Error("组件加载超时"));
            return;

          setTimeout(check, 100);
        };

      });

      updateActiveToc();
    });

    editor.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        renderNow();
      }

      if (event.key === "Tab") {
        event.preventDefault();

        if (editor.selectionStart !== editor.selectionEnd) {
          changeIndent(event.shiftKey ? -1 : 1);
          return;
        }

        if (event.shiftKey) {
          const lineStart =
            editor.value.lastIndexOf(
              "\n",
              editor.selectionStart - 1
            ) + 1;
          const removable =
            editor.value.slice(lineStart).match(/^(?: {1,2}|\t)/)?.[0]
            || "";

          if (removable) {
            replaceEditorTextRange(
              lineStart,
              lineStart + removable.length,
              "",
              Math.max(lineStart, editor.selectionStart - removable.length)
            );
          }

          return;
        }

        insertTextAtEditorCursor("  ", 2);
      }
    });

    window.addEventListener("resize", () => {
      updateToolbarHeight();
      fitAllRotatedImages(preview);
      refreshSyncAnchors();
      refreshTocPositions();
      updateActiveToc();

      if (syncScrollEnabled) {
        syncEditorToPreview();
      }
    });

    window.addEventListener("load", () => {
      restoreDraftOnStartup();

      const waitForLibraries = () => {
        if (window.marked && window.MathJax && MathJax.typesetPromise) {
          updateFormattingToolbarState();
          updateToolbarHeight();
          updateMetadataCompactSummary();
          updateEquationNumberingButton();
          updateMetadataBarCollapse();
          renderNow();
        } else {
          setTimeout(waitForLibraries, 150);
        }
      };

      waitForLibraries();
    });

    window.addEventListener("beforeunload", () => {
      clearTimeout(draftSaveTimer);
      saveDraftNow(false);
    });
  </script>


</body></html>
